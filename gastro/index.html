<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastroenterology Block — Question Bank</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/theme.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="../index.html" class="link-btn" style="text-decoration:none; display:inline-block;">&larr; All Blocks</a>
      <span class="brand">Gastroenterology Block Question Bank</span>
      <button id="homeBtn" class="link-btn" hidden>Home</button>
    </div>
  </header>
  <main id="main" class="container">
    <p class="loading">Loading question bank…</p>
  </main>
  <footer class="footer">
    <p>Client-side only — all progress is stored in this browser via localStorage.</p>
  </footer>
</div>
<script>window.QUIZ_CONFIG = {
  title: 'Gastroenterology Block Question Bank',
  storageKey: 'gastro',
  // Exam 1 = SDLs 1–20. Exam 2 = SDLs 21–30 (SDL 30 is Review).
  // Exam 3 = SDLs 31–40 (SDL 40 is Review); it is the course final, so the
  // shared Final Exam Simulation treats it as the last exam (50% of a run).
  // Questions land later in data.js (same schema as nephro/data.js). An empty
  // questions array renders as "coming soon" until then.
  finalPresets: []
};</script>
<script src="data.js"></script>
<script src="../shared/app.js"></script>
</body>
</html>
