<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nephrology/Urology/Men's Health Block — Question Bank</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/theme.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="../index.html" class="link-btn" style="text-decoration:none; display:inline-block;">&larr; All Blocks</a>
      <span class="brand">Nephrology/Urology/Men's Health Block Question Bank</span>
      <button id="homeBtn" class="link-btn" hidden>Home</button>
    </div>
  </header>
  <main id="main" class="container">
    <p class="loading">Loading question bank…</p>
  </main>
  <footer class="footer">
    <p>Client-side only — all progress is stored in this browser via localStorage.</p>
  </footer>
</div>
<script>window.QUIZ_CONFIG = {
  title: 'Nephrology/Urology/Men\'s Health Block Question Bank',
  storageKey: 'nephro',
  finalPresets: [],
  // Objective splits (shared/app.js, splitPresets): perObjective random questions from
  // every objective of every SDL in `exam`, then `extra` random ones from the rest of it.
  // Exam 1 (SDLs 1-12) has 47 objectives, so this runs 47 + 3 = 50 questions.
  splitPresets: [{
    id: 'moorjani',
    name: 'Moorjani Split',
    exam: 1,
    perObjective: 1,
    extra: 3
  }],
  // Batch 3 (per-SDL opt-in trial slot, shared/app.js BATCH3) is the Exam 2 trial set in
  // SDLs 13-24: kept out of exam totals and simulations like Neuro's Bloom Batch.
  batch3: {
    name: 'Trial',
    listLabel: 'trial questions',
    icon: '🧪',
    title: '🧪 Trial: shorter clinical stems + shorter answer choices',
    meta: 'experimental format, kept separate from Batches 1–2',
    hint: 'Trial set: the same Exam 2 objectives written with shorter clinical stems and shorter answer choices. It is kept out of the exam totals, Full Exam Simulation and the Custom Exam Builder.',
    banner: '🧪 Trial: shorter clinical stems + shorter answer choices',
    afterBatch2: true
  }
};</script>
<script src="data.js"></script>
<script src="../shared/app.js"></script>
</body>
</html>
