<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive metabolic and physiology atlas for COMLEX Level 1 and USMLE Step 1 — 16 pan/zoom maps with 229 diseases, drug targets and toxicities pinned to the exact enzyme or transporter they act on.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Metabolic Lesion Atlas">
<meta property="og:description" content="16 interactive maps. 229 lesions pinned to the step they break.">
<meta property="og:type" content="website">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:#EFEFEB}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Metabolic Lesion Atlas — COMLEX 1 / Step 1</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#EFEFEB; --surface:#FFFFFF; --surface-2:#F7F7F3; --surface-3:#EBEBE5;
  --ink:#22241F; --ink-2:#585A52; --ink-3:#8C8E85;
  --line:#DCDCD4; --line-2:#EAEAE3;
  --map-bg:#FAFAF7; --tint:7%;
  --accent:#1F6F68; --accent-soft:#E0EDEA;
  --p-glycolysis:#2C6E9B; --p-gluconeo:#7A55A0; --p-ppp:#17796E; --p-glycogen:#94701F;
  --p-sugars:#9B4278; --p-tca:#39784F; --p-etc:#55646F; --p-neutral:#6B7570;
  --m-dz:#BE3A4B; --m-drug:#C05A21; --m-reg:#42539E;
  --compartment:#F2F4EF; --compartment-line:#BCC9BC; --comp-text:#2F5F4E; --comp-badge:#D7E6DC;
  --shadow:0 1px 2px rgba(34,36,31,.05),0 12px 32px -18px rgba(34,36,31,.22);
  --font-ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-dis:"IBM Plex Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1C1A; --surface:#232622; --surface-2:#2A2E29; --surface-3:#343833;
  --ink:#EDEEE8; --ink-2:#B0B3A9; --ink-3:#818479;
  --line:#3A403A; --line-2:#2F3430;
  --map-bg:#1E211E; --tint:17%;
  --accent:#63BDAF; --accent-soft:#1E3A36;
  --p-glycolysis:#79B2DB; --p-gluconeo:#BFA0E2; --p-ppp:#4CC4B0; --p-glycogen:#D3AC55;
  --p-sugars:#E08FC0; --p-tca:#6FC492; --p-etc:#A3B0A8; --p-neutral:#94A099;
  --m-dz:#EE7386; --m-drug:#EE9556; --m-reg:#94A2F2;
  --compartment:#232B24; --compartment-line:#46584B; --comp-text:#8FD3B4; --comp-badge:#2B3E33;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#1A1C1A; --surface:#232622; --surface-2:#2A2E29; --surface-3:#343833;
  --ink:#EDEEE8; --ink-2:#B0B3A9; --ink-3:#818479;
  --line:#3A403A; --line-2:#2F3430;
  --map-bg:#1E211E; --tint:17%;
  --accent:#63BDAF; --accent-soft:#1E3A36;
  --p-glycolysis:#79B2DB; --p-gluconeo:#BFA0E2; --p-ppp:#4CC4B0; --p-glycogen:#D3AC55;
  --p-sugars:#E08FC0; --p-tca:#6FC492; --p-etc:#A3B0A8; --p-neutral:#94A099;
  --m-dz:#EE7386; --m-drug:#EE9556; --m-reg:#94A2F2;
  --compartment:#232B24; --compartment-line:#46584B; --comp-text:#8FD3B4; --comp-badge:#2B3E33;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}

/* ── header ─────────────────────────────────────────── */
.hdr{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:2px}
.brand h1{font-family:var(--font-dis);font-size:19px;font-weight:600;margin:0;letter-spacing:-.015em;white-space:nowrap}
.brand .sub{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 13px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(34,36,31,.14);font-weight:600}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{position:relative}
.search input{width:216px;max-width:44vw;padding:8px 12px 8px 31px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font-size:12.5px;font-family:var(--font-ui)}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{background:var(--surface);border-color:var(--accent);outline:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:var(--surface-3);color:var(--ink)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── shell ──────────────────────────────────────────── */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:262px minmax(0,1fr)}
.rail{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px 0 44px}
.rail-sec{padding:0 16px 20px}
.rail-h{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.rail-sub{margin:0;font-size:12px;line-height:1.5;color:var(--ink-2)}
.chips{display:flex;flex-direction:column;gap:2px}
.pchip{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:9px;font-size:12.5px;text-align:left;width:100%;color:var(--ink-2)}
.pchip:hover{background:var(--surface-2)}
.pchip.on{background:var(--surface-3);color:var(--ink);font-weight:600}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c)}
.pchip .n{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:9px}
.lg{display:flex;align-items:flex-start;gap:9px;font-size:11.5px;color:var(--ink-2);line-height:1.4}
.lg svg{flex:none;margin-top:1px}
.lesionlist{display:flex;flex-direction:column;gap:1px}
.li{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:9px;text-align:left;width:100%;line-height:1.35}
.li:hover{background:var(--surface-2)}
.li .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px;background:var(--c)}
.li .nm{font-size:12.5px;font-weight:600;color:var(--ink)}
.li .bz{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}

/* ── map ────────────────────────────────────────────── */
.mapwrap{position:relative;min-width:0;background:var(--map-bg);overflow:hidden}
svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.map.drag{cursor:grabbing}
.toolbar{position:absolute;left:16px;bottom:16px;display:flex;gap:3px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);z-index:6}
.tbtn{width:32px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);font-size:15px}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.tbtn.wide{width:auto;padding:0 12px;font-size:12px;font-weight:500}
.hint{position:absolute;right:16px;bottom:16px;font-size:11px;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:6px 11px;z-index:5;pointer-events:none;box-shadow:var(--shadow)}

/* svg primitives */
.node > rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.node.hub > rect{stroke-width:2.2}
.node.ghost > rect{fill:none!important;stroke-dasharray:4 4;stroke:var(--ink-3);stroke-width:1.2}
.node text.nl{font-family:var(--font-ui);font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.node.ghost text.nl{font-weight:500;font-size:11.5px;fill:var(--ink-2)}
.node text.ns{font-family:var(--font-ui);font-size:10px;fill:var(--ink-3);text-anchor:middle}
.node{cursor:pointer}
.node:hover > rect{stroke-width:2.6}
.node > rect.hl{stroke:var(--accent)!important;stroke-width:3.2}
.edge{fill:none;stroke-linecap:round}
.chip{cursor:pointer}
.chip rect.bg{fill:var(--map-bg);stroke-width:1}
.chip text{font-family:var(--font-ui);font-size:11px;dominant-baseline:middle}
.chip text.note{font-size:10px;fill:var(--ink-3)}
.chip:hover rect.bg{fill:var(--surface-3)}
.rl-bar{stroke-width:3;stroke-linecap:round}
.pin{cursor:pointer}
.pin text{font-family:var(--font-ui);font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin:hover .pshape{stroke:var(--ink);stroke-width:2}
.comp{fill:var(--compartment);stroke:var(--compartment-line);stroke-width:1.4}
.comp-l{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.12em;fill:var(--comp-text);text-transform:uppercase}
.comp-badge{fill:var(--comp-badge);stroke:var(--compartment-line);stroke-width:1}
.hlab{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.08em;fill:var(--comp-text)}
.mem{fill:var(--surface-3);stroke:var(--compartment-line);stroke-width:1.2}
.panel-c rect{fill:var(--surface);stroke:var(--line);stroke-width:1.1}
.panel-c text.pt{font-family:var(--font-dis);font-size:13.5px;font-weight:600;fill:var(--ink)}
.panel-c text.pl{font-family:var(--font-ui);font-size:11px;fill:var(--ink-2)}
.panel-c text.pk{font-family:var(--font-ui);font-size:11px;font-weight:600;fill:var(--ink-3)}
.dim{opacity:.12}
.flash .pshape{animation:pulse 1.2s ease-out 3;stroke:var(--ink)}
@keyframes pulse{0%{stroke-width:0;stroke-opacity:0}45%{stroke-width:8;stroke-opacity:.45}100%{stroke-width:0;stroke-opacity:0}}
@media (prefers-reduced-motion:reduce){.flash .pshape{animation:none;stroke:var(--ink);stroke-width:3}}

/* ── detail drawer ──────────────────────────────────── */
.drawer{position:absolute;top:0;right:0;bottom:0;width:404px;max-width:92%;background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;z-index:20;padding:0 0 36px}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line-2);padding:18px 20px 14px;z-index:2}
.dclose{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);font-size:17px}
.dclose:hover{background:var(--surface-2);color:var(--ink)}
.dkind{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);border-radius:99px;padding:4px 11px;margin-bottom:10px}
.dtitle{font-family:var(--font-dis);font-size:21px;font-weight:600;margin:0;line-height:1.24;letter-spacing:-.015em;padding-right:30px;text-wrap:balance}
.dalias{font-size:12.5px;color:var(--ink-3);margin:4px 0 0}
.dmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.mtag{font-size:11px;font-weight:500;padding:3px 9px;border-radius:7px;background:var(--surface-3);color:var(--ink-2)}
.mtag.hi{background:var(--m-dz);color:#fff}
.dbody{padding:18px 20px 0}
.fsec{margin:0 0 20px}
.fsec h4{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;
  display:flex;align-items:center;gap:9px}
.fsec h4::after{content:"";flex:1;height:1px;background:var(--line-2)}
.fsec ul{margin:0;padding-left:18px}
.fsec li{margin:0 0 6px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.fsec li::marker{color:var(--ink-3)}
.fsec li b,.fsec p b{color:var(--ink);font-weight:600}
.fsec p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.mechbox{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 15px}
.mechbox p{font-size:13px}
.buzz{display:flex;flex-wrap:wrap;gap:6px}
.bz{font-size:12px;font-weight:500;padding:5px 11px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.related{display:flex;flex-direction:column;gap:1px}
.rel{text-align:left;width:100%;padding:7px 10px;border-radius:9px;font-size:12.5px;color:var(--ink-2);display:flex;gap:9px;align-items:center}
.rel:hover{background:var(--surface-2);color:var(--ink)}
.rel .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}

/* ── index view ─────────────────────────────────────── */
.indexwrap{position:absolute;inset:0;overflow-y:auto;padding:30px 26px 70px;background:var(--bg)}
.idx-intro{max-width:64ch;margin:0 0 28px}
.idx-intro h2{font-family:var(--font-dis);font-size:26px;margin:0 0 8px;font-weight:600;letter-spacing:-.02em}
.idx-intro p{margin:0;color:var(--ink-2);font-size:14px}
.idxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:16px;align-items:start}
.idxcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(34,36,31,.04)}
.idxcard>h3{margin:0;padding:12px 15px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--c);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px;background:var(--surface-2)}
.idxcard>h3 .bar{width:3px;height:13px;border-radius:2px;background:var(--c)}
.idxcard ul{list-style:none;margin:0;padding:6px}
.idxrow{width:100%;text-align:left;padding:9px 11px;border-radius:10px;display:block;line-height:1.4}
.idxrow:hover{background:var(--surface-2)}
.idxrow .t{font-size:13.5px;font-weight:600;color:var(--ink)}
.idxrow .e{font-size:11.5px;color:var(--ink-3);display:block}
.idxrow .b{font-size:12px;color:var(--ink-2);display:block;margin-top:3px}
.empty{padding:44px 10px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* ── responsive ─────────────────────────────────────── */
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .drawer{width:100%;max-width:100%;top:auto;height:70%;border-left:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
}
@media (max-width:620px){
  .hdr{gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand .sub{display:none}
  .tabs{order:3;width:100%}
  .search input{width:100%;max-width:none}
  .hdr-right{flex:1;min-width:170px}
  .indexwrap{padding:20px 16px 56px}
}

/* ── OCOM Question Hub integration ─────────────────── */
:root{--accent:#1f4e79;--accent-soft:#E3ECF5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#7FB3DE;--accent-soft:#16293A}}
:root[data-theme="dark"]{--accent:#7FB3DE;--accent-soft:#16293A}
body{display:flex;flex-direction:column}
.app{flex:1;min-height:0;height:auto}
.hdr{padding-top:12px}
.ocom-topbar{background:#1f4e79;color:#fff;padding:14px 16px;flex:none;
  padding-top:calc(14px + env(safe-area-inset-top,0px))}
.ocom-topbar-inner{max-width:1100px;margin:0 auto;font-weight:700;font-size:1.1rem;
  display:flex;align-items:center;gap:14px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ocom-topbar-inner a{color:#fff;text-decoration:none;opacity:.85;font-weight:500;font-size:.95rem}
.ocom-topbar-inner a:hover{opacity:1;text-decoration:underline}
</style>


</head>
<body>
<div class="ocom-topbar"><div class="ocom-topbar-inner"><a href="../index.html">&larr; All Blocks</a><span>Metabolic Lesion Atlas</span></div></div>
<div class="app">
  <header class="hdr">
    <div class="brand">
      <h1>Metabolic Lesion Atlas</h1>
      <span class="sub">COMLEX 1 &middot; USMLE Step 1</span>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="hdr-right">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" placeholder="Search disease, enzyme, buzzword…" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn" id="quizBtn" aria-pressed="false" title="Hide enzyme names — click a chip to reveal">Quiz</button>
      <button class="btn" id="themeBtn" title="Toggle light / dark">◐</button>
    </div>
  </header>

  <div class="shell">
    <aside class="rail" id="rail"></aside>
    <div class="mapwrap" id="mapwrap">
      <svg class="map" id="svg" role="img" aria-label="Interactive metabolic pathway map"></svg>
      <div class="toolbar">
        <button class="tbtn" id="zin" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="tbtn" id="zout" title="Zoom out" aria-label="Zoom out">−</button>
        <button class="tbtn wide" id="zfit" title="Fit map to screen">Fit</button>
      </div>
      <div class="hint">drag to pan · scroll to zoom · click any pin</div>
      <div class="indexwrap" id="indexwrap" hidden></div>
      <aside class="drawer" id="drawer" hidden></aside>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   PATHWAY PALETTE
   ═══════════════════════════════════════════════════════════════ */
const PATHS = {
  glycolysis:{n:"Glycolysis",v:"--p-glycolysis"},
  gluconeo:{n:"Gluconeogenesis",v:"--p-gluconeo"},
  ppp:{n:"Pentose phosphate (HMP)",v:"--p-ppp"},
  glycogen:{n:"Glycogen",v:"--p-glycogen"},
  sugars:{n:"Fructose · galactose · polyol",v:"--p-sugars"},
  tca:{n:"TCA cycle",v:"--p-tca"},
  etc:{n:"Oxidative phosphorylation",v:"--p-etc"},
  fasyn:{n:"Fatty-acid synthesis",v:"--p-glycolysis"},
  faox:{n:"β-Oxidation · carnitine",v:"--p-glycogen"},
  ketone:{n:"Ketone bodies",v:"--p-gluconeo"},
  sterol:{n:"Cholesterol · bile · steroid",v:"--p-ppp"},
  lipoprotein:{n:"Lipoproteins",v:"--p-sugars"},
  urea:{n:"Urea cycle",v:"--p-glycolysis"},
  aa:{n:"Amino-acid catabolism",v:"--p-tca"},
  onec:{n:"One-carbon · SAM · B12",v:"--p-gluconeo"},
  catechol:{n:"Catecholamines · derivatives",v:"--p-sugars"},
  heme:{n:"Heme synthesis",v:"--p-glycogen"},
  bili:{n:"Bilirubin",v:"--p-sugars"},
  purine:{n:"Purines",v:"--p-glycolysis"},
  pyrimidine:{n:"Pyrimidines",v:"--p-ppp"},
  sphingo:{n:"Sphingolipid degradation",v:"--p-gluconeo"},
  gag:{n:"Glycosaminoglycans (MPS)",v:"--p-glycogen"},
  traffic:{n:"Lysosomal trafficking",v:"--p-ppp"},

/* ── collagen & extracellular matrix ────────────────── */

 tx:["Avoid contact sports and arterial catheterization in vascular EDS; celiprolol reduces rupture risk; vitamin C may help"]},

menkes:{n:"Menkes disease",k:"dz",p:"collagen",enz:"ATP7A copper transporter → lysyl oxidase",inh:"X-linked recessive",hi:1,

 tx:["<b>Chelate:</b> penicillamine (give B6 with it) or trientine","<b>Block absorption:</b> oral zinc induces metallothionein","Liver transplant for fulminant failure"]},

marfan:{n:"Marfan syndrome",k:"dz",p:"elastin",enz:"FBN1 — fibrillin-1 microfibrils",inh:"Autosomal dominant",hi:1,
 mech:"Fibrillin forms the scaffold that elastin is deposited on, and it also sequesters TGF-β. Losing it weakens elastic tissue <b>and</b> releases excess TGF-β signalling, which drives aortic root dilation.",

a1at:{n:"α1-Antitrypsin deficiency",k:"dz",p:"elastin",enz:"SERPINA1 — inhibitor of neutrophil elastase",inh:"Autosomal codominant",hi:1,

folatetrap:{n:"The methyl-folate trap",k:"reg",p:"watersol",enz:"Methionine synthase (B12 + N⁵-methyl-THF)",inh:"—",hi:1,

acetaminophen:{n:"Acetaminophen toxicity",k:"drug",p:"antiox",enz:"NAPQI conjugation by reduced glutathione",inh:"—",hi:1,

 labs:["Sympathetic tone steepens phase 4 → faster rate; vagal tone flattens it","SA node is the fastest pacemaker (60–100), then AV (40–60), then His-Purkinje (25–40)"],

wpw:{n:"Wolff-Parkinson-White syndrome",k:"dz",p:"conduction",enz:"Accessory pathway (bundle of Kent)",inh:"Congenital",hi:1,

 find:["Palpitations from paroxysmal SVT","<b>Short PR interval with a delta wave and a widened QRS</b>","If atrial fibrillation conducts down the accessory pathway, the ventricular rate can be lethal"],
 labs:["Associated with Ebstein anomaly"],
 buzz:["Delta wave with a short PR","<b>Never give AV nodal blockers</b> (adenosine, β-blockers, calcium channel blockers, digoxin) in AF with WPW — they push conduction down the accessory pathway → VF"],
 tx:["AF with WPW: <b>procainamide</b> or ibutilide, or cardioversion. Definitive: catheter ablation of the pathway"]},

longqt:{n:"Long QT syndrome & torsades de pointes",k:"dz",p:"conduction",enz:"Delayed rectifier K⁺ channels (or drugs that block them)",inh:"AD / AR / acquired",hi:1,
 mech:"Slower repolarization lengthens the QT and creates a window for early afterdepolarizations, which trigger a polymorphic ventricular tachycardia that twists around the baseline — <b>torsades de pointes</b>.",
 find:["Syncope, seizures or sudden death, classically with exertion, startle or emotion","<b>Romano-Ward</b>: autosomal dominant, purely cardiac","<b>Jervell and Lange-Nielsen</b>: autosomal recessive, with <b>congenital sensorineural deafness</b>","Acquired: class IA and III antiarrhythmics, macrolides, fluoroquinolones, antipsychotics, ondansetron, methadone, antifungals"],
 labs:["<b>QTc > 500 ms</b> is high risk","<b>Hypokalemia, hypomagnesemia, hypocalcemia</b> all prolong it","Bradycardia worsens it"],
 buzz:["Deafness plus syncope in a child = Jervell and Lange-Nielsen","Torsades treatment is <b>IV magnesium</b>, whatever the magnesium level"],
 tx:["Magnesium; correct electrolytes; stop the offending drug; β-blockers and ICD for congenital forms"]},

starling:{n:"Frank-Starling, preload and afterload",k:"reg",p:"hemo",enz:"Sarcomere length–tension relationship",inh:"—",hi:1,
 mech:"Stretching the sarcomere improves actin-myosin overlap and calcium sensitivity, so within limits <b>the heart pumps out whatever comes back</b>. Contractility shifts the whole curve; preload moves you along it.",
 find:["<b>Preload</b> ≈ end-diastolic volume — raised by volume, venoconstriction, lying down; lowered by <b>nitrates</b>, diuretics, hemorrhage","<b>Afterload</b> ≈ systemic vascular resistance and wall stress — raised by hypertension and aortic stenosis; lowered by <b>hydralazine</b>, ACE inhibitors, arteriolar dilators","<b>Contractility</b> raised by catecholamines, digoxin, calcium; lowered by β-blockers, non-DHP calcium blockers, acidosis, hypoxia"],
 labs:["Wall stress by Laplace: σ = (P × r) / 2h — dilation raises oxygen demand, hypertrophy lowers it","Myocardial O₂ demand rises with contractility, afterload, heart rate and wall tension"],
 buzz:["Venodilators drop preload; arteriolar dilators drop afterload; nitroprusside does both","In failure the curve is flattened and shifted down and right"],
 tx:["—"]},

hf:{n:"Heart failure",k:"dz",p:"hemo",enz:"Impaired ejection (HFrEF) or impaired filling (HFpEF)",inh:"Acquired",hi:1,
 mech:"A failing ventricle drops cardiac output, which triggers RAAS and sympathetic activation. Those compensations restore pressure in the short term and <b>drive remodeling and further failure</b> in the long term — which is why the drugs that help most are the ones that block them.",
 find:["<b>Left-sided</b>: orthopnea, paroxysmal nocturnal dyspnea, pulmonary edema, <b>S3 gallop</b>, crackles; heart failure cells (hemosiderin-laden macrophages) in the lung","<b>Right-sided</b>: jugular venous distension, hepatomegaly with nutmeg liver, peripheral edema, ascites — <b>most commonly caused by left heart failure</b>","HFpEF: normal EF with a stiff ventricle — hypertension, hypertrophy, age"],
 labs:["<b>↑ BNP / NT-proBNP</b>; a normal value largely excludes it in acute dyspnea","Echocardiography defines the ejection fraction","Chest film: cephalization, Kerley B lines, effusions"],
 buzz:["S3 in a dilated volume-overloaded ventricle; S4 in a stiff hypertrophied one","Right heart failure from lung disease alone = cor pulmonale"],
 tx:["See the heart-failure drug card — the four pillars plus diuretics for symptoms"]},

hfdrugs:{n:"Heart failure pharmacotherapy",k:"drug",p:"hemo",enz:"RAAS · sympathetic · natriuretic · SGLT2",inh:"—",hi:1,

 labs:["Avoid non-dihydropyridine calcium blockers and most antiarrhythmics in reduced EF","Check potassium and creatinine after each up-titration"],
 buzz:["Diuretics make patients feel better; the four pillars make them live longer"],

cardiomyopathy:{n:"Cardiomyopathies",k:"dz",p:"hemo",enz:"Sarcomere, cytoskeleton or infiltrate",inh:"Varies",hi:1,
 mech:"Three geometries, three physiologies: a dilated thin ventricle that cannot eject, a thick ventricle that cannot fill or that obstructs outflow, and a stiff infiltrated ventricle that cannot expand.",
 find:["<b>Dilated (most common)</b>: systolic failure, S3, balloon heart. Causes — idiopathic, alcohol, <b>doxorubicin</b>, cocaine, peripartum, Coxsackie B myocarditis, Chagas, thiamine deficiency, hemochromatosis","<b>Hypertrophic</b>: autosomal dominant sarcomere mutations (β-myosin heavy chain, myosin-binding protein C). <b>Sudden death in young athletes</b>; S4; <b>murmur louder with Valsalva and standing</b> (less preload), softer with squatting","<b>Restrictive</b>: amyloidosis, sarcoid, hemochromatosis, endomyocardial fibrosis, radiation. Low-voltage ECG with a thick wall suggests amyloid"],
 labs:["Hypertrophic: myofibrillar disarray on histology; avoid dehydration, digoxin and pure vasodilators","Dilated: eccentric hypertrophy; hypertrophic: concentric"],
 buzz:["Young athlete who collapses during exertion → hypertrophic cardiomyopathy","Murmur that gets LOUDER standing up is either HCM or mitral valve prolapse"],
 tx:["Dilated: standard heart-failure therapy. Hypertrophic: β-blocker, avoid volume depletion, ICD if high risk, mavacamten. Restrictive: treat the infiltrate"]},

mi:{n:"Myocardial ischemia & infarction",k:"dz",p:"hemo",enz:"Coronary supply vs myocardial oxygen demand",inh:"Acquired",hi:1,
 mech:"The left ventricle is perfused almost entirely during <b>diastole</b>, so tachycardia shortens supply exactly when demand rises. Plaque rupture with thrombus converts a fixed stenosis into an acute occlusion, and the <b>subendocardium</b> — the last territory perfused — dies first.",
 find:["<b>Stable angina</b>: predictable exertional chest pain relieved by rest or nitroglycerin; > 70% stenosis","<b>Unstable angina / NSTEMI</b>: pain at rest or crescendo; ST depression or T inversion. Troponin separates them","<b>STEMI</b>: full-thickness infarct, ST elevation in a vascular territory","<b>Prinzmetal</b>: vasospasm at rest, transient ST elevation, young smokers and cocaine users — treat with calcium channel blockers, not β-blockers"],
 labs:["<b>Troponin I</b> rises at 3–6 h, peaks at 24 h, stays up 7–10 days — the marker of choice","CK-MB normalizes in 48–72 h, so it is what detects <b>re</b>infarction","Territories: LAD → V1–V4 (anterior); LCx → I, aVL, V5–V6 (lateral); RCA → II, III, aVF (inferior, watch for bradycardia and RV involvement — avoid nitrates)"],
 buzz:["Inferior MI with hypotension after nitroglycerin → right ventricular infarct, give fluids","Complications by time: arrhythmia (first days) → free wall/septal/papillary rupture (3–14 days) → aneurysm and Dressler (weeks)"],
 tx:["Aspirin, P2Y12 inhibitor, anticoagulation, β-blocker, high-intensity statin; <b>reperfusion</b> — PCI within 90 minutes, fibrinolysis if unavailable"]},

nitrates:{n:"Nitrates",k:"drug",p:"hemo",enz:"NO → guanylate cyclase → cGMP → venodilation",inh:"—",hi:1,
 mech:"Nitrates release nitric oxide, raising cGMP in vascular smooth muscle. They dilate <b>veins much more than arteries</b>, so the dominant effect is a fall in preload, which cuts wall tension and myocardial oxygen demand.",
 find:["Nitroglycerin, isosorbide dinitrate and mononitrate","Uses: angina, acute coronary syndrome, acute pulmonary edema, hypertensive emergency","Adverse: <b>throbbing headache</b>, flushing, reflex tachycardia (pair with a β-blocker), hypotension","<b>Tolerance</b> develops within a day — requires a nitrate-free interval of 8–12 hours"],
 labs:["<b>Contraindicated with PDE5 inhibitors</b> (sildenafil) — both raise cGMP → profound hypotension","<b>Avoid in right ventricular infarction</b> and in hypertrophic cardiomyopathy — both are preload-dependent"],
 buzz:["Monday disease: industrial nitrate exposure, tolerance over the week, headache and tachycardia on return","Nitrates reduce demand; they do not open the blocked artery"],
 tx:["—"]},

/* ── pulmonary ──────────────────────────────────────── */
deadspace:{n:"Dead space & the conducting zone",k:"reg",p:"airway",enz:"Anatomic vs physiologic dead space",inh:"—",hi:1,
 mech:"The first ~150 mL of each breath never reaches an alveolus. Anything ventilated but not perfused adds to it, so physiologic dead space is the sum of the plumbing and the wasted alveoli.",
 find:["Conducting zone: nose to <b>terminal bronchioles</b> — warms, humidifies, filters; no gas exchange","Respiratory zone: respiratory bronchioles, alveolar ducts and sacs","Cartilage and goblet cells end at the bronchi; <b>club (Clara) cells</b> and cilia continue into the bronchioles"],
 labs:["Alveolar ventilation = (tidal volume − dead space) × respiratory rate","Rapid shallow breathing wastes a larger fraction on dead space"],
 buzz:["Pulmonary embolism is the classic cause of increased dead space","Terminal bronchiole is the last purely conducting structure"],
 tx:["—"]},

aagradient:{n:"A–a gradient & the alveolar gas equation",k:"reg",p:"gasex",enz:"PAO₂ = 150 − PaCO₂ / 0.8 (room air, sea level)",inh:"—",hi:1,
 mech:"Comparing the oxygen the alveolus should contain with what actually reaches the artery separates problems of ventilation from problems of gas exchange. A normal gradient with hypoxemia means the alveolus never got the oxygen; a widened gradient means it could not cross.",
 find:["Normal A–a gradient ≈ <b>5–15 mmHg</b>, rising roughly with age (age/4 + 4)","<b>Normal gradient</b>: high altitude (low inspired O₂) and <b>hypoventilation</b> (opioids, obesity hypoventilation, neuromuscular disease)","<b>Widened gradient</b>: <b>V/Q mismatch</b>, <b>right-to-left shunt</b>, <b>diffusion limitation</b>"],
 labs:["<b>Supplemental O₂ corrects V/Q mismatch and diffusion limitation, but NOT a true shunt</b> — that is the bedside discriminator","Hypoventilation raises PaCO₂; the other causes usually lower it from the hyperventilatory response"],
 buzz:["Hypoxemia that will not correct with 100% oxygen = shunt","Opioid overdose: hypoxemia with a NORMAL A–a gradient"],
 tx:["—"]},

vq:{n:"V/Q mismatch, shunt and dead space",k:"reg",p:"gasex",enz:"Ventilation-to-perfusion ratio",inh:"—",hi:1,
 mech:"Both ventilation and perfusion are higher at the base of the upright lung, but perfusion varies more — so the <b>apex has a high V/Q (~3) and the base a low V/Q (~0.6)</b>. Hypoxic pulmonary vasoconstriction diverts blood away from poorly ventilated alveoli to limit mismatch.",
 find:["<b>V/Q → 0 (shunt)</b>: perfused but not ventilated — atelectasis, pneumonia, pulmonary edema, ARDS, intracardiac right-to-left shunt","<b>V/Q → ∞ (dead space)</b>: ventilated but not perfused — <b>pulmonary embolism</b>","The apex is where <b>TB</b> reactivates (high O₂) and where <b>bullae</b> form; the base is where emboli and aspiration (when supine, the superior segment of the lower lobe) land"],
 labs:["Hypoxic vasoconstriction is the opposite of the systemic circulation, where hypoxia dilates","Chronic global hypoxia → global vasoconstriction → pulmonary hypertension and cor pulmonale"],
 buzz:["Apex: high V/Q, TB reactivation. Base: low V/Q, most blood flow","Right lower lobe is where aspirated material goes when upright"],
 tx:["—"]},

hypoxemia:{n:"The five causes of hypoxemia",k:"reg",p:"gasex",enz:"—",inh:"—",hi:1,
 mech:"Ordering them by A–a gradient and response to oxygen solves almost every arterial blood gas question.",
 find:["<b>1. Low inspired PO₂</b> (altitude) — normal A–a, corrects with O₂","<b>2. Hypoventilation</b> — normal A–a, ↑ PaCO₂, corrects with O₂","<b>3. V/Q mismatch</b> (the most common) — widened A–a, corrects with O₂","<b>4. Diffusion limitation</b> — widened A–a, corrects with O₂","<b>5. Right-to-left shunt</b> — widened A–a, <b>does not correct</b> with O₂"],
 labs:["Hypoxia ≠ hypoxemia: anemia and carbon monoxide cause tissue hypoxia with a <b>normal PaO₂</b>","Cyanosis needs ≈ 5 g/dL of deoxygenated hemoglobin — so it appears early in polycythemia and late in anemia"],

 tx:["—"]},

cohb:{n:"Carbon monoxide poisoning",k:"drug",p:"o2transport",enz:"Hemoglobin O₂ binding (and cytochrome c oxidase)",inh:"—",hi:1,
 mech:"CO binds hemoglobin with roughly 250 times the affinity of oxygen, so it both <b>removes carrying capacity</b> and <b>left-shifts</b> the curve on the remaining hemes, making them release less oxygen to tissue. It also inhibits complex IV directly.",
 find:["Headache, nausea, dizziness, confusion — often mistaken for viral illness; whole households affected","Smoke inhalation, faulty furnaces, generators indoors, methylene chloride (paint stripper) exposure","Classic \"cherry-red\" skin is uncommon and usually postmortem"],
 labs:["<b>Normal PaO₂ with low measured oxygen saturation</b> — pulse oximetry reads falsely normal because it cannot distinguish carboxyhemoglobin","Diagnose with <b>co-oximetry</b> (carboxyhemoglobin level)","Metabolic acidosis with elevated lactate"],
 buzz:["Pulse oximeter lies in CO poisoning","Delayed neuropsychiatric sequelae weeks later"],
 tx:["<b>100% oxygen</b> by non-rebreather; <b>hyperbaric oxygen</b> for loss of consciousness, neurologic signs, ischemia or pregnancy"]},

methb:{n:"Methemoglobinemia",k:"drug",p:"o2transport",enz:"Heme iron oxidized Fe²⁺ → Fe³⁺",inh:"Acquired / congenital",hi:1,
 mech:"Ferric heme cannot bind oxygen at all, and it <b>left-shifts</b> the remaining ferrous hemes, so delivery falls twice over.",
 find:["<b>Cyanosis that does not improve with oxygen</b>","<b>Chocolate-brown blood</b> that does not turn red on exposure to air","Causes: <b>nitrites</b> (well water, food preservatives), <b>dapsone</b>, <b>benzocaine and lidocaine</b>, nitroglycerin, antimalarials","<b>Congenital cytochrome b5 reductase deficiency</b> — lifelong slate-grey cyanosis in a well child"],
 labs:["<b>Normal PaO₂ with a low oxygen saturation</b> and a wide saturation gap","Pulse oximetry classically saturates near 85% regardless of true oxygenation","Co-oximetry confirms it"],
 buzz:["Blue patient, brown blood, normal PaO₂","Nitrites are deliberately given in cyanide poisoning — they create methemoglobin, which binds cyanide"],
 tx:["<b>Methylene blue</b> (needs NADPH from the HMP shunt) — <b>contraindicated in G6PD deficiency</b>, where ascorbic acid or exchange transfusion is used instead"]},

asthma:{n:"Asthma",k:"dz",p:"airway",enz:"Bronchial hyperresponsiveness and type 2 inflammation",inh:"Multifactorial",hi:1,
 mech:"Allergen cross-links IgE on mast cells → early bronchospasm; recruited eosinophils and Th2 cytokines drive the late phase and remodeling. Obstruction is <b>reversible</b>, which is the defining feature.",

 buzz:["Pulsus paradoxus in a severe attack","Rising CO₂ in an asthmatic means intubate, not reassure"],

copd:{n:"COPD — emphysema & chronic bronchitis",k:"dz",p:"alveolus",enz:"Protease–antiprotease imbalance · mucous gland hypertrophy",inh:"Acquired",hi:1,
 mech:"Smoke recruits neutrophils and macrophages whose elastase overwhelms α1-antitrypsin, destroying alveolar walls. Losing the walls also loses the <b>radial traction</b> that holds small airways open, so they collapse on expiration — irreversible airflow limitation.",
 find:["<b>Emphysema</b> (\"pink puffer\"): dyspnea, barrel chest, pursed-lip breathing, ↓ breath sounds","<b>Centriacinar, upper lobes</b> = smoking · <b>Panacinar, lower lobes</b> = α1-antitrypsin deficiency","<b>Chronic bronchitis</b> (\"blue bloater\"): productive cough ≥ 3 months for 2 consecutive years; hypoxemia, cor pulmonale","<b>Reid index > 0.4</b> (gland layer thickness relative to bronchial wall)"],
 labs:["<b>↓ FEV₁/FVC, ↑ TLC, ↑ RV</b>; <b>↓ DLCO in emphysema</b> but normal in chronic bronchitis","Chest film: hyperinflation, flattened diaphragms, increased retrosternal air"],
 buzz:["DLCO separates emphysema (low) from asthma and chronic bronchitis (normal)","Only smoking cessation and long-term oxygen improve mortality"],
 tx:["Smoking cessation, bronchodilators, vaccines, pulmonary rehabilitation; <b>oxygen if PaO₂ ≤ 55 or SaO₂ ≤ 88%</b>"]},

asthmadrugs:{n:"Asthma & COPD drugs",k:"drug",p:"airway",enz:"β2 · muscarinic · leukotriene · IgE · phosphodiesterase",inh:"—",hi:1,

 tx:["—"]},

cf:{n:"Cystic fibrosis",k:"dz",p:"airway",enz:"CFTR chloride channel (ΔF508)",inh:"Autosomal recessive",hi:1,
 mech:"A misfolded CFTR never reaches the membrane, so chloride (and water) cannot be secreted onto airway surfaces. Mucus becomes thick and immobile. In sweat glands the channel normally <b>reabsorbs</b> chloride, so sweat becomes salty instead.",
 find:["Recurrent pulmonary infection → <b>bronchiectasis</b>; organisms shift from <i>S. aureus</i> in childhood to <b><i>Pseudomonas aeruginosa</i></b> later","<b>Meconium ileus</b> in the newborn; pancreatic insufficiency with steatorrhea and fat-soluble vitamin deficiency","<b>Infertility in males</b> — congenital bilateral absence of the vas deferens","Nasal polyps, clubbing, failure to thrive, distal intestinal obstruction"],
 labs:["<b>Sweat chloride > 60 mmol/L</b> — the diagnostic test; on the newborn screen (immunoreactive trypsinogen)","Chromosome 7, ΔF508 is a 3-base deletion causing misfolding and proteasomal degradation"],
 buzz:["Salty-tasting baby","Bronchiectasis plus pancreatic insufficiency plus male infertility"],
 tx:["Airway clearance, dornase alfa, hypertonic saline, inhaled antibiotics, pancreatic enzymes and ADEK vitamins","<b>CFTR modulators</b> — elexacaftor/tezacaftor/ivacaftor"]},

nrds:{n:"Neonatal respiratory distress syndrome",k:"dz",p:"alveolus",enz:"Surfactant (dipalmitoylphosphatidylcholine) from type II pneumocytes",inh:"Acquired",hi:1,
 mech:"Surfactant lowers alveolar surface tension. By Laplace's law (P = 2T/r) small alveoli would otherwise collapse into large ones; without surfactant they do, producing diffuse atelectasis and a massive right-to-left shunt.",

ards:{n:"Acute respiratory distress syndrome",k:"dz",p:"alveolus",enz:"Diffuse alveolar damage",inh:"Acquired",hi:1,

pulmhtn:{n:"Pulmonary hypertension",k:"dz",p:"alveolus",enz:"Endothelin · nitric oxide · prostacyclin imbalance",inh:"Varies",hi:1,

ild:{n:"Interstitial lung disease",k:"dz",p:"alveolus",enz:"Fibroblast proliferation in the interstitium",inh:"Acquired",hi:1,
 mech:"Repeated alveolar injury heals by fibrosis instead of regeneration. A thickened stiff interstitium restricts expansion and lengthens the diffusion path — a <b>restrictive</b> pattern with a low DLCO.",

/* ── eicosanoids ────────────────────────────────────── */

ttp:{n:"TTP and HUS",k:"dz",p:"hemostasis",enz:"ADAMTS13 (TTP) · Shiga toxin endothelial injury (HUS)",inh:"Acquired",hi:1,

dic:{n:"Disseminated intravascular coagulation",k:"dz",p:"coag",enz:"Systemic activation of the whole cascade",inh:"Acquired",hi:1,

factorv:{n:"Factor V Leiden & hypercoagulable states",k:"dz",p:"fibrinolysis",enz:"Activated protein C · antithrombin III",inh:"Autosomal dominant",hi:1,
 mech:"Thrombin bound to endothelial <b>thrombomodulin</b> activates protein C, which with protein S inactivates factors <b>Va and VIIIa</b> — the body's own brake on the cascade. Factor V Leiden is a point mutation that makes factor Va <b>resistant to being cleaved</b>, so the brake fails.",
 find:["<b>The most common inherited hypercoagulable state</b> in people of European descent","Deep vein thrombosis, pulmonary embolism, cerebral and portal vein thrombosis","Risk multiplies with oral contraceptives, pregnancy, surgery, immobility","Others: prothrombin G20210A, antithrombin III deficiency, protein C or S deficiency, antiphospholipid syndrome"],
 labs:["Activated protein C resistance assay, then genetic confirmation","<b>Protein C or S deficiency → warfarin-induced skin necrosis</b>, because those two have the shortest half-lives and fall first","Antithrombin III deficiency: heparin fails to prolong the PTT as expected"],
 buzz:["Unprovoked DVT in a young patient with a family history","Warfarin skin necrosis points at protein C or S"],
 tx:["Anticoagulation for events; duration depends on whether the clot was provoked"]},

p2y12:{n:"P2Y12 inhibitors",k:"drug",p:"hemostasis",enz:"P2Y12 ADP receptor on the platelet",inh:"—",hi:1,
 mech:"Activated platelets release ADP, which acts back on P2Y12 to amplify activation and to express GpIIb/IIIa on the surface. Blocking that receptor blunts the amplification loop — a completely separate mechanism from aspirin, which is why the two are used together.",

heparin:{n:"Heparin & low-molecular-weight heparin",k:"drug",p:"fibrinolysis",enz:"Antithrombin III",inh:"—",hi:1,
 mech:"Heparin does not inactivate anything itself — it binds <b>antithrombin III</b> and accelerates its activity roughly a thousandfold. Unfractionated heparin is long enough to bridge antithrombin to thrombin (IIa) and Xa both; LMWH is shorter and mainly potentiates anti-Xa activity.",

doac:{n:"Direct oral anticoagulants",k:"drug",p:"fibrinolysis",enz:"Factor Xa · thrombin (IIa)",inh:"—",hi:1,

tpa:{n:"Thrombolytics",k:"drug",p:"fibrinolysis",enz:"Plasminogen → plasmin",inh:"—",hi:1,

txadrug:{n:"Antifibrinolytics",k:"drug",p:"fibrinolysis",enz:"Plasminogen activation (lysine analogues)",inh:"—",hi:1,

hae:{n:"Hereditary angioedema",k:"dz",p:"kinin",enz:"C1 esterase inhibitor",inh:"Autosomal dominant",hi:1,
 mech:"C1 esterase inhibitor restrains both complement <b>and</b> the contact pathway — it inhibits kallikrein and factor XIIa. Losing it lets kallikrein run unchecked, cleaving HMW kininogen into <b>bradykinin</b>, which makes vessels leak. The swelling is bradykinin-mediated, not histamine-mediated, which is why antihistamines and epinephrine do nothing.",

coagreg:{n:"PT vs PTT — reading a coagulation panel",k:"reg",p:"coag",enz:"Extrinsic vs intrinsic vs common pathway",inh:"—",hi:1,
 mech:"The two tests split the cascade. <b>PT</b> measures the extrinsic and common pathways (tissue factor, VII, X, V, II, fibrinogen); <b>PTT</b> measures the intrinsic and common pathways (XII, XI, IX, VIII, X, V, II, fibrinogen). Whichever is abnormal tells you which arm is broken.",

liverdz:{n:"Coagulopathy of liver disease",k:"dz",p:"coag",enz:"Hepatic synthesis of clotting factors",inh:"Acquired",hi:1,
 mech:"The liver makes every coagulation factor except VIII and vWF, plus the anticoagulants protein C, protein S and antithrombin. Advanced liver disease therefore <b>depletes both sides at once</b> — which is why these patients are not simply 'auto-anticoagulated' and can still thrombose.",

 tx:["Treat the liver disease; FFP or PCC and platelets only for active bleeding or before procedures"]}

function nodeBox(n){
  const cw=n.k==="ghost"?6.7:7.45;
  const w=n.w||Math.max(82,n.l.length*cw+26,n.s?n.s.length*5.9+26:0);
  return {w,h:n.s?46:34,x:n.x-w/2,y:n.y-(n.s?23:17)};
}
function edgePoint(n,tx,ty){
  const b=nodeBox(n),dx=tx-n.x,dy=ty-n.y;
  if(!dx&&!dy)return{x:n.x,y:n.y};
  const hw=b.w/2+5,hh=b.h/2+5;
  const s=Math.min(dx?hw/Math.abs(dx):1e9, dy?hh/Math.abs(dy):1e9);
  return {x:n.x+dx*s,y:n.y+dy*s};
}
function geom(m,e){
  const A=m._n[e.a],B=m._n[e.b];
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1;
  const bend=e.bend||0,cx=mx+(dy/L)*bend,cy=my+(-dx/L)*bend;
  const p1=edgePoint(A,cx,cy),p2=edgePoint(B,cx,cy);
  return {p1,p2,cx,cy,qx:.25*p1.x+.5*cx+.25*p2.x,qy:.25*p1.y+.5*cy+.25*p2.y,
    d:`M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`};
}

  if(m.mem){const b=m.mem;
    comps+=`<g class="compg"><rect class="mem" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6"/>
      <g class="comp-tag"><rect class="comp-badge" x="${b.x+26}" y="${b.y+b.h+14}" width="140" height="24" rx="8"/><text class="comp-l" x="${b.x+38}" y="${b.y+b.h+30.5}">${esc(b.l)}</text></g>`;
    [980,1420,1640].forEach(x=>{comps+=`<path d="M${x} ${b.y+b.h+4} v26" stroke="var(--compartment-line)" stroke-width="2" marker-end="url(#ah-etc)"/><text class="hlab" x="${x+9}" y="${b.y+b.h+26}">H⁺</text>`;});
    comps+=`<path d="M1880 ${b.y+b.h+30} v-26" stroke="var(--compartment-line)" stroke-width="2" marker-end="url(#ah-etc)"/><text class="hlab" x="1889" y="${b.y+b.h+26}">H⁺</text></g>`;}
  const panels=(m.panels||[]).map(panelSVG).join("");
  let edges="",chips="",tips="";
  m.edges.forEach((e,i)=>{
    e._k=e.a+">"+e.b;
    const g=geom(m,e),col=pc(e.p),ar=e.arrow||"one";
    const sw=e.rl?2.5:1.9, so=e.dash?.7:.92;
    edges+=`<path class="edge" data-p="${e.p}" d="${g.d}" stroke="${col}" stroke-width="${sw}" stroke-opacity="${so}" ${e.dash?'stroke-dasharray="7 5"':""}/>`;
    if(ar!=="none"){
      const span=Math.hypot(g.p2.x-g.p1.x,g.p2.y-g.p1.y), len=Math.max(9,Math.min(26,span*0.45));
      const stub=(fx,fy,tx2,ty2,mk)=>{
        let dx=fx-tx2,dy=fy-ty2,L=Math.hypot(dx,dy)||1;
        const sx=fx-(dx/L)*len, sy=fy-(dy/L)*len;
        return `<path class="edge" data-p="${e.p}" d="M${sx.toFixed(1)} ${sy.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" stroke="${col}" stroke-width="${sw}" stroke-opacity="${so}" marker-end="url(#${mk}-${e.p})"/>`;
      };
      tips+=stub(g.p2.x,g.p2.y,g.cx,g.cy,ar==="inhib"?"in":"ah");
      if(ar==="both") tips+=stub(g.p1.x,g.p1.y,g.cx,g.cy,"ah");
    }
    if(e.e) chips+=`<g data-p="${e.p}">${chipSVG(e,g)}</g>`;
    else if(e.m&&e.m.length) chips+=`<g data-p="${e.p}">${e.m.map((id,j)=>pinSVG(id,j,g.qx+(e.lx||0),g.qy+(e.ly||0))).join("")}</g>`;
  });
  const nodes=m.nodes.map(nodeSVG).join("");
  svg.setAttribute("viewBox",`0 0 ${m.w} ${m.h}`);
  svg.innerHTML=`<defs>${defs}</defs><g id="cam"><g class="bg-layer">${comps}${panels}</g><g class="edge-layer">${edges}</g><g class="node-layer">${nodes}</g><g class="chip-layer">${chips}</g><g class="tip-layer">${tips}</g></g>`;
  cam=svg.querySelector("#cam");
  fitChips(); fitPanels(); fitComps(); applyCam(); applyFilter(); markSelected();
}
function fitChips(){
  svg.querySelectorAll(".chipwrap").forEach(g=>{
    const r=g.querySelector("rect.bg"); if(!r) return;
    const cx=+g.dataset.cx, cy=+g.dataset.cy;
    let w=0;
    g.querySelectorAll(".chip text").forEach(t=>{const L=t.getComputedTextLength(); if(L>w) w=L;});
    w=Math.ceil(w)+20;
    r.setAttribute("x",(cx-w/2).toFixed(1)); r.setAttribute("width",w);
    const bar=g.querySelector(".rl-bar");
    if(bar){const bx=(cx-w/2+3).toFixed(1); bar.setAttribute("x1",bx); bar.setAttribute("x2",bx);}
    g.querySelectorAll(".pin").forEach((p,i)=>p.setAttribute("transform",`translate(${(cx+w/2+14+i*23).toFixed(1)} ${cy})`));
  });
}
function fitComps(){
  svg.querySelectorAll(".comp-tag").forEach(g=>{
    const r=g.querySelector("rect"), t=g.querySelector("text");
    if(r&&t) r.setAttribute("width",Math.ceil(t.getComputedTextLength())+24);
  });
}
function fitPanels(){
  svg.querySelectorAll(".panel-c").forEach(g=>{
    const r=g.querySelector("rect"),x=+r.getAttribute("x");let need=+r.getAttribute("width");
    g.querySelectorAll("text").forEach(t=>{const e=+t.getAttribute("x")+t.getComputedTextLength()+15-x;if(e>need)need=e;});
    if(need>+r.getAttribute("width")){const w=Math.ceil(need);r.setAttribute("width",w);
      const l=g.querySelector("line");if(l)l.setAttribute("x2",x+w-15);}
  });
}
function applyCam(){ if(cam) cam.setAttribute("transform",`translate(${state.tx.toFixed(2)} ${state.ty.toFixed(2)}) scale(${state.z.toFixed(3)})`); }
function applyFilter(){
  svg.querySelectorAll("[data-p]").forEach(el=>{
    el.classList.toggle("dim", !!state.filter && el.getAttribute("data-p")!==state.filter);
  });
}
function markSelected(){
  svg.querySelectorAll(".pin").forEach(p=>p.classList.toggle("flash",false));
  if(!state.sel) return;
  svg.querySelectorAll(`.pin[data-les="${state.sel}"] .pshape`).forEach(s=>{s.setAttribute("stroke","var(--ink)");s.setAttribute("stroke-width","2.5");});
}

/* ── drawer ─────────────────────────────────────────── */
const sec=(t,inner)=>inner?`<div class="fsec"><h4>${t}</h4>${inner}</div>`:"";
const ul=a=>(a&&a.length)?`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
function openLes(id,center){
  const L=LES[id]; if(!L) return;
  state.sel=id; drawer.hidden=false;
  const rel=Object.entries(LES).filter(([k,v])=>v.p===L.p&&k!==id).slice(0,7);
  drawer.innerHTML=`
   <div class="dhead">
     <button class="dclose" id="dclose" aria-label="Close">×</button>
     <span class="dkind" style="--k:${mkc(L.k)}">${MK[L.k].g}&nbsp;&nbsp;${MK[L.k].n}</span>
     <h2 class="dtitle">${esc(L.n)}</h2>
     ${L.alias?`<p class="dalias">${esc(L.alias)}</p>`:""}
     <div class="dmeta">
       ${L.hi?'<span class="mtag hi">High yield</span>':""}
       <span class="mtag">${esc((PATHS[L.p]||PATHS.neutral).n)}</span>
       ${L.inh&&L.inh!=="—"?`<span class="mtag">${esc(L.inh)}</span>`:""}
     </div>
   </div>
   <div class="dbody">
     ${L.enz?sec("Enzyme / step",`<p><b>${esc(L.enz)}</b></p>`):""}
     ${L.mech?sec("Mechanism",`<div class="mechbox"><p>${L.mech}</p></div>`):""}
     ${sec("Presentation",ul(L.find))}
     ${sec("Labs &amp; studies",ul(L.labs))}
     ${L.buzz&&L.buzz.length?sec("Buzzwords",`<div class="buzz">${L.buzz.map(b=>`<span class="bz">${esc(b)}</span>`).join("")}</div>`):""}
     ${(L.tx&&L.tx.length&&L.tx[0]!=="—")?sec("Management",ul(L.tx)):""}
     ${rel.length?sec("Same pathway",`<div class="related">${rel.map(([k,v])=>`<button class="rel" data-go="${k}" style="--c:${mkc(v.k)}"><span class="dot"></span>${esc(v.n)}</button>`).join("")}</div>`):""}
   </div>`;
  drawer.scrollTop=0;
  document.getElementById("dclose").onclick=()=>{drawer.hidden=true;state.sel=null;render();renderRail();};
  drawer.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>gotoLes(b.dataset.go));
  renderRail();
  if(state.view!=="index"){ render(); flashPins(id,center); }
}
function flashPins(id,center){
  const pins=[...svg.querySelectorAll(`.pin[data-les="${id}"]`)];
  pins.forEach(p=>p.classList.add("flash"));
  if(center&&pins.length){
    const t=(pins[0].getAttribute("transform")||"").match(/translate\(([-\d.]+) ([-\d.]+)\)/);
    if(t) centerOn(+t[1],+t[2]);
  }
}
function gotoLes(id){
  const loc=(LOC[id]||[])[0];
  if(loc&&loc.v!==state.view) setView(loc.v);
  openLes(id,true);
}
function centerOn(x,y){
  const m=MAPS[state.view];
  state.z=Math.max(state.z,1.25);
  state.tx=m.w/2-x*state.z; state.ty=m.h/2-y*state.z; applyCam();
}

/* ── rail ───────────────────────────────────────────── */
function lesMatches(L,q){
  if(!q) return true;
  const hay=[L.n,L.alias||"",L.enz||"",L.mech||"",(PATHS[L.p]||{}).n||"",
    ...(L.find||[]),...(L.labs||[]),...(L.buzz||[]),...(L.tx||[])].join(" ").toLowerCase();
  return hay.includes(q);
}
function currentLesIds(){
  const q=state.q.trim().toLowerCase();
  let ids;
  if(q||state.view==="index") ids=Object.keys(LES);
  else ids=[...new Set(Object.keys(LOC).filter(id=>LOC[id].some(l=>l.v===state.view)))];
  return ids.filter(id=>LES[id]&&lesMatches(LES[id],q)&&(!state.filter||state.view==="index"||LES[id].p===state.filter));
}
function renderRail(){
  const m=MAPS[state.view];
  let html="";
  if(m&&m.sub) html+=`<div class="rail-sec"><p class="rail-sub">${esc(m.sub)}</p></div>`;
  if(m){
    const counts={};
    m.edges.forEach(e=>counts[e.p]=(counts[e.p]||0)+1);
    m.nodes.forEach(n=>counts[n.p]=(counts[n.p]||0)+0);
    const keys=[...new Set([...m.nodes.map(n=>n.p),...m.edges.map(e=>e.p)])].filter(p=>p!=="neutral");
    html+=`<div class="rail-sec"><h3 class="rail-h">Pathways</h3><div class="chips">
      <button class="pchip${state.filter?"":" on"}" data-f=""><span class="swatch" style="--c:var(--ink-3)"></span>Show everything</button>
      ${keys.map(p=>`<button class="pchip${state.filter===p?" on":""}" data-f="${p}"><span class="swatch" style="--c:${pc(p)}"></span>${esc(PATHS[p].n)}<span class="n">${counts[p]||""}</span></button>`).join("")}
    </div></div>`;
  }
  html+=`<div class="rail-sec"><h3 class="rail-h">Markers</h3><div class="legend">
    ${Object.entries(MK).map(([k,v])=>`<div class="lg"><svg width="19" height="19" viewBox="-10 -10 20 20">${
      k==="dz"?`<circle r="9" fill="${mkc(k)}"/>`:k==="drug"?`<rect x="-7.5" y="-7.5" width="15" height="15" rx="2" fill="${mkc(k)}" transform="rotate(45)"/>`:`<rect x="-8" y="-8" width="16" height="16" rx="4" fill="${mkc(k)}"/>`
    }<text x="0" y="0.5" text-anchor="middle" dominant-baseline="central" fill="#fff" style="font:700 10px sans-serif">${v.g}</text></svg>${v.n}</div>`).join("")}
    <div class="lg"><svg width="19" height="19" viewBox="0 0 20 20"><line x1="4" y1="3" x2="4" y2="17" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/></svg>Rate-limiting step</div>
    <div class="lg"><svg width="19" height="19" viewBox="0 0 20 20"><line x1="1" y1="10" x2="19" y2="10" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="5 4"/></svg>Multi-step, transport or regulation</div>
  </div></div>`;
  const ids=currentLesIds();
  html+=`<div class="rail-sec"><h3 class="rail-h">${state.q?"Search results":(state.view==="index"?"All lesions":"Lesions on this map")} · ${ids.length}</h3>
    <div class="lesionlist">${ids.length?ids.map(id=>{const L=LES[id];
      return `<button class="li" data-les="${id}" style="--c:${mkc(L.k)}"><span class="dot"></span><span><span class="nm">${esc(L.n)}</span><span class="bz">${esc(L.buzz&&L.buzz[0]?L.buzz[0]:(L.enz||""))}</span></span></button>`;
    }).join(""):`<p style="font-size:12.5px;color:var(--ink-3);padding:4px 7px">No match. Try “Heinz”, “orotic”, “second wind”.</p>`}</div></div>`;
  rail.innerHTML=html;
  rail.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.f||null;render();renderRail();if(state.view==="index")renderIndex();});
  rail.querySelectorAll("[data-les]").forEach(b=>b.onclick=()=>gotoLes(b.dataset.les));
}

/* ── index view ─────────────────────────────────────── */
function renderIndex(){
  const q=state.q.trim().toLowerCase();
  const ids=Object.keys(LES).filter(id=>lesMatches(LES[id],q));
  const groups={};
  ids.forEach(id=>{(groups[LES[id].p]=groups[LES[id].p]||[]).push(id);});
  const cards=Object.entries(groups).map(([p,list])=>`
    <section class="idxcard" style="--c:${pc(p)}"><h3><span class="bar"></span>${esc((PATHS[p]||PATHS.neutral).n)}</h3>
    <ul>${list.map(id=>{const L=LES[id];return `<li><button class="idxrow" data-les="${id}">
      <span class="t">${esc(L.n)}</span><span class="e">${esc(L.enz||"")}</span>
      ${L.buzz&&L.buzz[0]?`<span class="b">${esc(L.buzz[0])}</span>`:""}</button></li>`;}).join("")}</ul></section>`).join("");
  idxWrap.innerHTML=`<div class="idx-intro"><h2>Every lesion on one page</h2>
    <p>${ids.length} entries across the four maps — grouped by pathway, each with the enzyme it sits on and the phrase a question is most likely to hand you. Click any row to jump to its exact position on the map.</p></div>
    ${cards||`<p class="empty">Nothing matches “${esc(state.q)}”.</p>`}`;
  idxWrap.querySelectorAll("[data-les]").forEach(b=>b.onclick=()=>gotoLes(b.dataset.les));
}

/* ── views & camera ─────────────────────────────────── */
function setView(v){
  state.view=v; state.filter=null; state.z=1; state.tx=0; state.ty=0;
  const isIdx=v==="index";
  svg.hidden=isIdx; idxWrap.hidden=!isIdx;
  document.querySelector(".toolbar").hidden=isIdx;
  document.querySelector(".hint").hidden=isIdx;
  tabsEl.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.v===v)));
  if(isIdx) renderIndex(); else render();
  renderRail();
  try{localStorage.setItem("mla-view",v);}catch(e){}
}
function toVB(cx,cy){
  const ctm=svg.getScreenCTM(); if(!ctm) return {x:0,y:0};
  const p=svg.createSVGPoint(); p.x=cx; p.y=cy;
  const q=p.matrixTransform(ctm.inverse()); return {x:q.x,y:q.y};
}
function zoomBy(k,px,py){
  const m=MAPS[state.view]; if(!m) return;
  const p=(px==null)?{x:m.w/2,y:m.h/2}:{x:px,y:py};
  const nz=Math.min(6,Math.max(.35,state.z*k));
  state.tx=p.x-(p.x-state.tx)*(nz/state.z);
  state.ty=p.y-(p.y-state.ty)*(nz/state.z);
  state.z=nz; applyCam();
}
svg.addEventListener("wheel",ev=>{ev.preventDefault();const p=toVB(ev.clientX,ev.clientY);zoomBy(ev.deltaY<0?1.14:1/1.14,p.x,p.y);},{passive:false});
let drag=null;
svg.addEventListener("pointerdown",ev=>{
  if(ev.target.closest(".pin,.chip,.node")) return;
  drag={p:toVB(ev.clientX,ev.clientY),tx:state.tx,ty:state.ty};
  svg.setPointerCapture(ev.pointerId); svg.classList.add("drag");
});
svg.addEventListener("pointermove",ev=>{
  if(!drag) return;
  const p=toVB(ev.clientX,ev.clientY);
  state.tx=drag.tx+(p.x-drag.p.x); state.ty=drag.ty+(p.y-drag.p.y); applyCam();
});
["pointerup","pointercancel","pointerleave"].forEach(t=>svg.addEventListener(t,()=>{drag=null;svg.classList.remove("drag");}));
svg.addEventListener("click",ev=>{
  const pin=ev.target.closest(".pin");
  if(pin){ openLes(pin.dataset.les,false); return; }
  const chip=ev.target.closest(".chip");
  if(chip){
    const m=MAPS[state.view], e=m.edges.find(x=>x._k===chip.dataset.chip);
    if(state.quiz&&!state.reveal.has(chip.dataset.chip)){ state.reveal.add(chip.dataset.chip); render(); return; }
    if(e&&e.m&&e.m.length) openLes(e.m[0],false);
    return;
  }
  const nd=ev.target.closest(".node");
  if(nd){
    const n=MAPS[state.view]._n[nd.dataset.node];
    if(n.m&&n.m.length){ openLes(n.m[0],false); return; }
    if(n.go){ setView(n.go); return; }
    if(n.hl){ const t=svg.querySelector(`.node[data-node="${n.hl}"] > rect`); if(t){ t.classList.add("hl"); setTimeout(()=>t.classList.remove("hl"),1800); centerOn(MAPS[state.view]._n[n.hl].x,MAPS[state.view]._n[n.hl].y);} }
  }
});
document.getElementById("zin").onclick=()=>zoomBy(1.25);
document.getElementById("zout").onclick=()=>zoomBy(1/1.25);
document.getElementById("zfit").onclick=()=>{state.z=1;state.tx=0;state.ty=0;applyCam();};
document.getElementById("quizBtn").onclick=e=>{
  state.quiz=!state.quiz; state.reveal.clear();
  const b=e.currentTarget; b.classList.toggle("on",state.quiz); b.setAttribute("aria-pressed",String(state.quiz));
  b.textContent=state.quiz?"Quiz on":"Quiz";
  if(state.view!=="index") render();
};
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("mla-theme",next);}catch(e){}
  if(state.view!=="index") render();
};
let qt;
qInput.addEventListener("input",()=>{
  clearTimeout(qt);
  qt=setTimeout(()=>{state.q=qInput.value;renderRail();if(state.view==="index")renderIndex();},130);
});
qInput.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"){ const ids=currentLesIds(); if(ids.length===1) gotoLes(ids[0]); else if(state.view!=="index") setView("index"); }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="/"&&document.activeElement!==qInput){ ev.preventDefault(); qInput.focus(); }
  if(ev.key==="Escape"){ drawer.hidden=true; state.sel=null; }
});

/* ── init ───────────────────────────────────────────── */
tabsEl.innerHTML=VIEWS.map(([v,l])=>`<button class="tab" role="tab" data-v="${v}" aria-selected="${v==="core"}">${l}</button>`).join("");
tabsEl.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.v));
try{const th=localStorage.getItem("mla-theme"); document.documentElement.setAttribute("data-theme",th||"light");}catch(e){document.documentElement.setAttribute("data-theme","light");}
let start="core";
try{const v=localStorage.getItem("mla-view"); if(v&&VIEWS.some(x=>x[0]===v)) start=v;}catch(e){}
setView(start);
openLes("g6pd",false);
</script>
</body>
</html>
