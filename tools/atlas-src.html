<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesion Atlas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#EFEFEB; --surface:#FFFFFF; --surface-2:#F7F7F3; --surface-3:#EBEBE5;
  --ink:#22241F; --ink-2:#585A52; --ink-3:#8C8E85;
  --line:#DCDCD4; --line-2:#EAEAE3;
  --map-bg:#FAFAF7; --tint:7%;
  --accent:#1F6F68; --accent-soft:#E0EDEA;
  --p-glycolysis:#2C6E9B; --p-gluconeo:#7A55A0; --p-ppp:#17796E; --p-glycogen:#94701F;
  --p-sugars:#9B4278; --p-tca:#39784F; --p-etc:#55646F; --p-neutral:#6B7570;
  --m-dz:#BE3A4B; --m-drug:#C05A21; --m-reg:#42539E;
  --ok:#2E7D4F; --bad:#B8323F;
  --compartment:#F2F4EF; --compartment-line:#BCC9BC; --comp-text:#2F5F4E; --comp-badge:#D7E6DC;
  --shadow:0 1px 2px rgba(34,36,31,.05),0 12px 32px -18px rgba(34,36,31,.22);
  --font-ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-dis:"IBM Plex Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1C1A; --surface:#232622; --surface-2:#2A2E29; --surface-3:#343833;
  --ink:#EDEEE8; --ink-2:#B0B3A9; --ink-3:#818479;
  --line:#3A403A; --line-2:#2F3430;
  --map-bg:#1E211E; --tint:17%;
  --accent:#63BDAF; --accent-soft:#1E3A36;
  --p-glycolysis:#79B2DB; --p-gluconeo:#BFA0E2; --p-ppp:#4CC4B0; --p-glycogen:#D3AC55;
  --p-sugars:#E08FC0; --p-tca:#6FC492; --p-etc:#A3B0A8; --p-neutral:#94A099;
  --m-dz:#EE7386; --m-drug:#EE9556; --m-reg:#94A2F2;
  --ok:#6FC492; --bad:#EE7386;
  --compartment:#232B24; --compartment-line:#46584B; --comp-text:#8FD3B4; --comp-badge:#2B3E33;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#1A1C1A; --surface:#232622; --surface-2:#2A2E29; --surface-3:#343833;
  --ink:#EDEEE8; --ink-2:#B0B3A9; --ink-3:#818479;
  --line:#3A403A; --line-2:#2F3430;
  --map-bg:#1E211E; --tint:17%;
  --accent:#63BDAF; --accent-soft:#1E3A36;
  --p-glycolysis:#79B2DB; --p-gluconeo:#BFA0E2; --p-ppp:#4CC4B0; --p-glycogen:#D3AC55;
  --p-sugars:#E08FC0; --p-tca:#6FC492; --p-etc:#A3B0A8; --p-neutral:#94A099;
  --m-dz:#EE7386; --m-drug:#EE9556; --m-reg:#94A2F2;
  --ok:#6FC492; --bad:#EE7386;
  --compartment:#232B24; --compartment-line:#46584B; --comp-text:#8FD3B4; --comp-badge:#2B3E33;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}

/* ── header ─────────────────────────────────────────── */
.hdr{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:2px}
.brand h1{font-family:var(--font-dis);font-size:19px;font-weight:600;margin:0;letter-spacing:-.015em;white-space:nowrap}
.brand .sub{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 13px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(34,36,31,.14);font-weight:600}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{position:relative}
.search input{width:216px;max-width:44vw;padding:8px 12px 8px 31px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font-size:12.5px;font-family:var(--font-ui)}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{background:var(--surface);border-color:var(--accent);outline:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:var(--surface-3);color:var(--ink)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── shell ──────────────────────────────────────────── */
:root{--rail-w:262px}
:root[data-rail="off"]{--rail-w:0px}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);transition:grid-template-columns .22s ease}
@media (prefers-reduced-motion:reduce){.shell{transition:none}}
.rail{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;overflow-x:hidden;padding:18px 0 44px}
:root[data-rail="off"] .rail{border-right:none}
.rail-sec{padding:0 16px 20px}
.rail-h{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.rail-sub{margin:0;font-size:12px;line-height:1.5;color:var(--ink-2)}
.chips{display:flex;flex-direction:column;gap:2px}
.pchip{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:9px;font-size:12.5px;text-align:left;width:100%;color:var(--ink-2)}
.pchip:hover{background:var(--surface-2)}
.pchip.on{background:var(--surface-3);color:var(--ink);font-weight:600}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c)}
.pchip .n{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:9px}
.lg{display:flex;align-items:flex-start;gap:9px;font-size:11.5px;color:var(--ink-2);line-height:1.4}
.lg svg{flex:none;margin-top:1px}
.lesionlist{display:flex;flex-direction:column;gap:1px}
.li{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:9px;text-align:left;width:100%;line-height:1.35}
.li:hover{background:var(--surface-2)}
.li .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px;background:var(--c)}
.li .nm{font-size:12.5px;font-weight:600;color:var(--ink)}
.li .bz{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}

/* ── map ────────────────────────────────────────────── */
.mapwrap{position:relative;min-width:0;background:var(--map-bg);overflow:hidden}
svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;-moz-user-select:none}
.toolbar,.hint,.tabs,.hdr .brand{user-select:none;-webkit-user-select:none}
svg.map.drag{cursor:grabbing}
.toolbar{position:absolute;left:16px;bottom:16px;display:flex;gap:3px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);z-index:6}
.tbtn{width:32px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);font-size:15px}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.tbtn.wide{width:auto;padding:0 12px;font-size:12px;font-weight:500}
.hint{position:absolute;right:16px;bottom:16px;font-size:11px;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:6px 11px;z-index:5;pointer-events:none;box-shadow:var(--shadow)}

/* svg primitives */
.node > rect{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.node.hub > rect{stroke-width:2.2}
.node.ghost > rect{fill:none!important;stroke-dasharray:4 4;stroke:var(--ink-3);stroke-width:1.2}
.node text.nl{font-family:var(--font-ui);font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.node.ghost text.nl{font-weight:500;font-size:11.5px;fill:var(--ink-2)}
.node text.ns{font-family:var(--font-ui);font-size:10px;fill:var(--ink-3);text-anchor:middle}
.node{cursor:pointer}
.node:hover > rect{stroke-width:2.6}
.node > rect.hl{stroke:var(--accent)!important;stroke-width:3.2}
.edge{fill:none;stroke-linecap:round}
.chip{cursor:pointer}
.chip rect.bg{fill:var(--map-bg);stroke-width:1}
.chip text{font-family:var(--font-ui);font-size:11px;dominant-baseline:middle}
.chip text.note{font-size:10px;fill:var(--ink-3)}
.chip:hover rect.bg{fill:var(--surface-3)}
.rl-bar{stroke-width:3;stroke-linecap:round}
.pin{cursor:pointer}
.pin text{font-family:var(--font-ui);font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin:hover .pshape{stroke:var(--ink);stroke-width:2}
.comp{fill:var(--compartment);stroke:var(--compartment-line);stroke-width:1.4}
.comp-l{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.12em;fill:var(--comp-text);text-transform:uppercase}
.comp-badge{fill:var(--comp-badge);stroke:var(--compartment-line);stroke-width:1}
.hlab{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.08em;fill:var(--comp-text)}
.mem{fill:var(--surface-3);stroke:var(--compartment-line);stroke-width:1.2}
.panel-c rect{fill:var(--surface);stroke:var(--line);stroke-width:1.1}
.panel-c text.pt{font-family:var(--font-dis);font-size:13.5px;font-weight:600;fill:var(--ink)}
.panel-c text.pl{font-family:var(--font-ui);font-size:11px;fill:var(--ink-2)}
.panel-c text.pk{font-family:var(--font-ui);font-size:11px;font-weight:600;fill:var(--ink-3)}
.dim{opacity:.12}
.flash .pshape{animation:pulse 1.2s ease-out 3;stroke:var(--ink)}
@keyframes pulse{0%{stroke-width:0;stroke-opacity:0}45%{stroke-width:8;stroke-opacity:.45}100%{stroke-width:0;stroke-opacity:0}}
@media (prefers-reduced-motion:reduce){.flash .pshape{animation:none;stroke:var(--ink);stroke-width:3}}

/* ── detail drawer ──────────────────────────────────── */
.drawer{position:absolute;top:0;right:0;bottom:0;width:404px;max-width:92%;background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;z-index:20;padding:0 0 36px}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line-2);padding:18px 20px 14px;z-index:2}
.dclose{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);font-size:17px}
.dclose:hover{background:var(--surface-2);color:var(--ink)}
.dkind{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);border-radius:99px;padding:4px 11px;margin-bottom:10px}
.dtitle{font-family:var(--font-dis);font-size:21px;font-weight:600;margin:0;line-height:1.24;letter-spacing:-.015em;padding-right:30px;text-wrap:balance}
.dalias{font-size:12.5px;color:var(--ink-3);margin:4px 0 0}
.dmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.mtag{font-size:11px;font-weight:500;padding:3px 9px;border-radius:7px;background:var(--surface-3);color:var(--ink-2)}
.mtag.hi{background:var(--m-dz);color:#fff}
.dbody{padding:18px 20px 0}
.fsec{margin:0 0 20px}
.fsec h4{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;
  display:flex;align-items:center;gap:9px}
.fsec h4::after{content:"";flex:1;height:1px;background:var(--line-2)}
.fsec ul{margin:0;padding-left:18px}
.fsec li{margin:0 0 6px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.fsec li::marker{color:var(--ink-3)}
.fsec li b,.fsec p b{color:var(--ink);font-weight:600}
.fsec p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.mechbox{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 15px}
.mechbox p{font-size:13px}
.buzz{display:flex;flex-wrap:wrap;gap:6px}
.bz{font-size:12px;font-weight:500;padding:5px 11px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.related{display:flex;flex-direction:column;gap:1px}
.rel{text-align:left;width:100%;padding:7px 10px;border-radius:9px;font-size:12.5px;color:var(--ink-2);display:flex;gap:9px;align-items:center}
.rel:hover{background:var(--surface-2);color:var(--ink)}
.rel .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}

/* ── index view ─────────────────────────────────────── */
.indexwrap{position:absolute;inset:0;overflow-y:auto;padding:30px 26px 70px;background:var(--bg)}
.idx-intro{max-width:64ch;margin:0 0 28px}
.idx-intro h2{font-family:var(--font-dis);font-size:26px;margin:0 0 8px;font-weight:600;letter-spacing:-.02em}
.idx-intro p{margin:0;color:var(--ink-2);font-size:14px}
.idxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:16px;align-items:start}
.idxcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(34,36,31,.04)}
.idxcard>h3{margin:0;padding:12px 15px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--c);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px;background:var(--surface-2)}
.idxcard>h3 .bar{width:3px;height:13px;border-radius:2px;background:var(--c)}
.idxcard ul{list-style:none;margin:0;padding:6px}
.idxrow{width:100%;text-align:left;padding:9px 11px;border-radius:10px;display:block;line-height:1.4}
.idxrow:hover{background:var(--surface-2)}
.idxrow .t{font-size:13.5px;font-weight:600;color:var(--ink)}
.idxrow .e{font-size:11.5px;color:var(--ink-3);display:block}
.idxrow .b{font-size:12px;color:var(--ink-2);display:block;margin-top:3px}
.empty{padding:44px 10px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* ── topic bar and its map row ────────────────────── */
.subbar{flex-basis:100%;order:5;display:flex;min-width:0;margin:-4px 0 -2px}
.subtabs{display:flex;gap:5px;overflow-x:auto;max-width:100%;scrollbar-width:none;padding:1px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .tab{padding:4px 12px;border-radius:99px;font-size:12px;border:1px solid var(--line-2);background:var(--surface-2)}
.subtabs .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;box-shadow:none}

/* ── quiz menu · pin quiz · share link ─────────────── */
.qwrap{position:relative}
.qmenu{position:absolute;right:0;top:calc(100% + 6px);width:244px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:5px;z-index:40;display:flex;flex-direction:column;gap:1px}
.qopt{text-align:left;padding:8px 10px 8px 30px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink);position:relative;line-height:1.35}
.qopt span{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3)}
.qopt:hover{background:var(--surface-2)}
.qopt[aria-checked="true"]::before{content:"✓";position:absolute;left:11px;top:8px;color:var(--accent);font-weight:700}
.qscore{position:absolute;left:16px;top:14px;z-index:6;display:flex;align-items:center;gap:9px;flex-wrap:wrap;max-width:calc(100% - 32px);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 12px;box-shadow:var(--shadow);font-size:12px;color:var(--ink-2)}
.qscore b{color:var(--ink);font-variant-numeric:tabular-nums}
.qbar{width:64px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.qscore button{padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:500;color:var(--ink-2)}
.qscore button:hover{background:var(--surface-2);color:var(--ink)}
.qscore button.go{background:var(--accent);color:#fff}
.pin.pq-ok .pshape{stroke:var(--ok);stroke-width:3.2}
.pin.pq-bad .pshape{stroke:var(--bad);stroke-width:3.2}
.pqwhere{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.pqwhere b{color:var(--ink)}
.pqopts{display:flex;flex-direction:column;gap:7px}
.pqopt{text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.35}
.pqopt:hover{background:var(--surface-3);border-color:var(--ink-3)}
.pqres{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 13px;border-radius:10px;font-size:13px;font-weight:600;margin:0 0 18px}
.pqres.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pqres.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.pqres span{flex:1;min-width:150px}
.pqres button{padding:6px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink)}
.dlink{position:absolute;top:13px;right:45px;height:28px;padding:0 9px;border-radius:9px;font-size:11.5px;font-weight:500;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.dlink:hover{background:var(--surface-2);color:var(--ink)}

/* ── responsive ─────────────────────────────────────── */
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  #railBtn{display:none}
  .drawer{width:100%;max-width:100%;top:auto;height:70%;border-left:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
}
@media (max-width:620px){
  .hdr{gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand .sub{display:none}
  .tabs{order:3;width:100%}
  .search input{width:100%;max-width:none}
  .hdr-right{flex:1;min-width:170px}
  .indexwrap{padding:20px 16px 56px}
}
</style>

<div class="app">
  <header class="hdr">
    <div class="brand">
      <h1>Lesion Atlas</h1>
      <span class="sub">COMLEX 1 &middot; USMLE Step 1</span>
    </div>
    <div class="tabs topics" role="tablist" id="topics" aria-label="Topics"></div>
    <div class="hdr-right">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" placeholder="Search disease, enzyme, buzzword…" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn" id="railBtn" aria-pressed="false" title="Hide the side panel  ( [ )" aria-label="Toggle the side panel">◧</button>
      <div class="qwrap">

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const pc=p=>`var(${(PATHS[p]||PATHS.neutral).v})`;
const mkc=k=>`var(${MK[k].v})`;

function nodeBox(n){
  const cw=n.k==="ghost"?6.7:7.45;
  const w=n.w||Math.max(82,n.l.length*cw+26,n.s?n.s.length*5.9+26:0);
  return {w,h:n.s?46:34,x:n.x-w/2,y:n.y-(n.s?23:17)};
}
function edgePoint(n,tx,ty){
  const b=nodeBox(n),dx=tx-n.x,dy=ty-n.y;
  if(!dx&&!dy)return{x:n.x,y:n.y};
  const hw=b.w/2+5,hh=b.h/2+5;
  const s=Math.min(dx?hw/Math.abs(dx):1e9, dy?hh/Math.abs(dy):1e9);
  return {x:n.x+dx*s,y:n.y+dy*s};
}
function geom(m,e){
  const A=m._n[e.a],B=m._n[e.b];
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1;
  const bend=e.bend||0,cx=mx+(dy/L)*bend,cy=my+(-dx/L)*bend;
  const p1=edgePoint(A,cx,cy),p2=edgePoint(B,cx,cy);
  return {p1,p2,cx,cy,qx:.25*p1.x+.5*cx+.25*p2.x,qy:.25*p1.y+.5*cy+.25*p2.y,
    d:`M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`};
}
function pinSVG(id,i,x,y){
  const L=LES[id]; if(!L) return "";
  const c=mkc(L.k),g=MK[L.k].g,px=x+i*23;
  let shape;
  if(L.k==="dz") shape=`<circle class="pshape" r="9.5" fill="${c}"/>`;
  else if(L.k==="drug") shape=`<rect class="pshape" x="-8" y="-8" width="16" height="16" rx="2" fill="${c}" transform="rotate(45)"/>`;
  else shape=`<rect class="pshape" x="-8.5" y="-8.5" width="17" height="17" rx="4.5" fill="${c}"/>`;
  const pq=state.quiz==="pins", done=pq&&PQ[state.view]&&(id in PQ[state.view]);
  const cls="pin"+(done?(PQ[state.view][id]?" pq-ok":" pq-bad"):"");
  const tip=pq&&!done?"Which lesion is this?":L.n;
  return `<g class="${cls}" data-les="${id}" transform="translate(${px.toFixed(1)} ${y.toFixed(1)})"><title>${esc(tip)}</title>${shape}<text>${g}</text></g>`;
}
/* While naming pins, a label beside an unanswered pin must not spell out the
   answer ("Vancomycin caps D-Ala-D-Ala"), so its name words are blanked. */
function quizMask(ids,text){
  if(state.quiz!=="pins"||!ids||!ids.length) return text;
  const done=PQ[state.view]||{};
  return ids.filter(id=>LES[id]&&!(id in done)).reduce((t,id)=>redactor(LES[id])(t),text);
}
function chipSVG(e,geo){
  const hidden=state.quiz==="steps"&&!state.reveal.has(e._k);
  const lines=quizMask(e.m,e.e).split("|"),CW=5.75,LH=13.6;
  let w=Math.max(...lines.map(l=>l.length))*CW+20;
  if(e.note) w=Math.max(w,e.note.length*5.2+20);
  const h=lines.length*LH+(e.note?13:0)+9;
  const cx=geo.qx+(e.lx||0),cy=geo.qy+(e.ly||0);
  const x=cx-w/2,y=cy-h/2,col=pc(e.p);
  let t="";
  if(hidden){
    t=`<text x="${cx}" y="${cy}" text-anchor="middle" fill="var(--ink-3)" style="font-size:14px;font-weight:600">?</text>`;
  }else{
    let ty=y+9+LH/2;
    lines.forEach((l,i)=>{t+=`<text x="${cx}" y="${ty.toFixed(1)}" text-anchor="middle" fill="${col}" style="font-weight:${e.rl?600:400}">${esc(l)}</text>`;ty+=LH;});
    if(e.note) t+=`<text class="note" x="${cx}" y="${(y+h-8).toFixed(1)}" text-anchor="middle">${esc(e.note)}</text>`;
  }
  const bar=e.rl?`<line class="rl-bar" x1="${(x+2).toFixed(1)}" y1="${(y+5).toFixed(1)}" x2="${(x+2).toFixed(1)}" y2="${(y+h-5).toFixed(1)}" stroke="${col}"/>`:"";
  const pins=(e.m||[]).map((id,i)=>pinSVG(id,i,x+w+14,cy)).join("");
  return `<g class="chipwrap" data-cx="${cx.toFixed(1)}" data-cy="${cy.toFixed(1)}"><g class="chip" data-chip="${e._k}"><rect class="bg" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="8" stroke="${col}" stroke-opacity=".5"/>${bar}${t}</g>${pins}</g>`;
}
function nodeSVG(n){
  const b=nodeBox(n),col=pc(n.p);
  const cls="node"+(n.k==="hub"?" hub":"")+(n.k==="ghost"?" ghost":"");
  let t;
  const nl=quizMask(n.m,n.l), ns=n.s&&quizMask(n.m,n.s);
  if(n.s) t=`<text class="nl" y="-6">${esc(nl)}</text><text class="ns" y="13">${esc(ns)}</text>`;
  else t=`<text class="nl" y="0">${esc(nl)}</text>`;
  const pins=(n.m||[]).map((id,i)=>pinSVG(id,i,b.w/2-4,-b.h/2-4)).join("");
  const fill=n.k==="ghost"?"":`style="stroke:${col};fill:var(--surface);fill:color-mix(in srgb, ${col} var(--tint), var(--surface))"`;
  return `<g class="${cls}" data-node="${n.id}" data-p="${n.p}" transform="translate(${n.x} ${n.y})">
    <rect x="${-b.w/2}" y="${-b.h/2}" width="${b.w}" height="${b.h}" rx="10" ${fill}/>${t}${pins}</g>`;
}
function panelSVG(p){
  const kw=p.kw||150;
  let rows="";
  p.rows.forEach((r,i)=>{
    const y=p.y+50+i*22;
    if(r[0]) rows+=`<text class="pk" x="${p.x+15}" y="${y}">${esc(r[0])}</text>`;
    rows+=`<text class="pl" x="${p.x+15+kw}" y="${y}">${esc(r[1])}</text>`;
  });
  return `<g class="panel-c"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="14"/>
    <text class="pt" x="${p.x+15}" y="${p.y+26}">${esc(p.t)}</text>
    <line x1="${p.x+15}" y1="${p.y+34}" x2="${p.x+p.w-15}" y2="${p.y+34}" stroke="var(--line-2)"/>${rows}</g>`;
}
function render(){

  const defs=paths.map(p=>`

   <marker id="in-${p}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><rect x="5" y="0.5" width="2.6" height="9" fill="${pc(p)}"/></marker>`).join("");
  let comps=(m.comps||[]).map(c=>`<g class="compg"><rect class="comp" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="26"/><g class="comp-tag"><rect class="comp-badge" x="${c.x+26+(c.tx||0)}" y="${c.y-12+(c.ty||0)}" width="140" height="24" rx="8"/><text class="comp-l" x="${c.x+38+(c.tx||0)}" y="${c.y+4.5+(c.ty||0)}">${esc(c.l)}</text></g></g>`).join("");
  if(m.mem){const b=m.mem;
    comps+=`<g class="compg"><rect class="mem" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6"/>
      <g class="comp-tag"><rect class="comp-badge" x="${b.x+26}" y="${b.y+b.h+14}" width="140" height="24" rx="8"/><text class="comp-l" x="${b.x+38}" y="${b.y+b.h+30.5}">${esc(b.l)}</text></g>`;
    [980,1420,1640].forEach(x=>{comps+=`<path d="M${x} ${b.y+b.h+4} v26" stroke="var(--compartment-line)" stroke-width="2" marker-end="url(#ah-etc)"/><text class="hlab" x="${x+9}" y="${b.y+b.h+26}">H⁺</text>`;});

  const panels=(m.panels||[]).map(panelSVG).join("");
  let edges="",chips="",tips="";
  m.edges.forEach((e,i)=>{
    e._k=e.a+">"+e.b;

      const span=Math.hypot(g.p2.x-g.p1.x,g.p2.y-g.p1.y), len=Math.max(9,Math.min(26,span*0.45));
      const stub=(fx,fy,tx2,ty2,mk)=>{
        let dx=fx-tx2,dy=fy-ty2,L=Math.hypot(dx,dy)||1;
        const sx=fx-(dx/L)*len, sy=fy-(dy/L)*len;
        return `<path class="edge" data-p="${e.p}" d="M${sx.toFixed(1)} ${sy.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" stroke="${col}" stroke-width="${sw}" stroke-opacity="${so}" marker-end="url(#${mk}-${e.p})"/>`;
      };

  });

  cam=svg.querySelector("#cam");

}
/* Text measurement.
   Every box on every map is sized from measured text, so the measurement has to be
   right on any engine. Two hazards:
     - getComputedTextLength() returns advance widths; getBBox() returns ink extent.
       Either can be the larger, so take both.
     - some engines omit letter-spacing from BOTH. .comp-l carries .12em, so on those
       engines the compartment badge came out far too narrow and the label ran past
       the pill. Detect it once with a probe rather than assuming.
   Detection runs on the live <svg> so it sees the real font and rendering path. */
let LS_MISSING = false;
function detectLetterSpacing(){
  try{
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x","-9999"); t.setAttribute("y","-9999");
    t.setAttribute("class","comp-l");
    t.textContent="ABCDEFGHIJ";                       // 10 characters
    svg.appendChild(t);
    const raw=el=>{ let w=0;
      try{ w=el.getComputedTextLength()||0; }catch(e){}
      try{ const b=el.getBBox().width; if(b>w) w=b; }catch(e){}
      return w; };
    t.style.letterSpacing="0px"; const a=raw(t);
    t.style.letterSpacing="5px"; const b=raw(t);
    svg.removeChild(t);
    LS_MISSING = (b-a) < 25;                          // ~50px expected when counted
  }catch(e){ LS_MISSING=false; }
}
function textW(t){
  let w=0;
  try{ w=t.getComputedTextLength()||0; }catch(e){}
  try{ const b=t.getBBox().width; if(b>w) w=b; }catch(e){}
  if(LS_MISSING){
    try{
      const ls=parseFloat(getComputedStyle(t).letterSpacing);
      if(ls>0) w += ls*((t.textContent||"").length);
    }catch(e){}
  }
  return w;
}
function fitChips(){
  svg.querySelectorAll(".chipwrap").forEach(g=>{
    const r=g.querySelector("rect.bg"); if(!r) return;
    const cx=+g.dataset.cx, cy=+g.dataset.cy;
    let w=0;
    g.querySelectorAll(".chip text").forEach(t=>{const L=textW(t); if(L>w) w=L;});
    w=Math.ceil(w)+20;
    r.setAttribute("x",(cx-w/2).toFixed(1)); r.setAttribute("width",w);
    const bar=g.querySelector(".rl-bar");
    if(bar){const bx=(cx-w/2+3).toFixed(1); bar.setAttribute("x1",bx); bar.setAttribute("x2",bx);}
    g.querySelectorAll(".pin").forEach((p,i)=>p.setAttribute("transform",`translate(${(cx+w/2+14+i*23).toFixed(1)} ${cy})`));
  });
}
function fitComps(){
  svg.querySelectorAll(".comp-tag").forEach(g=>{
    const r=g.querySelector("rect"), t=g.querySelector("text");
    if(r&&t) r.setAttribute("width",Math.ceil(textW(t))+24);
  });
}
function fitPanels(){
  svg.querySelectorAll(".panel-c").forEach(g=>{
    const r=g.querySelector("rect"),x=+r.getAttribute("x");let need=+r.getAttribute("width");
    g.querySelectorAll("text").forEach(t=>{const e=+t.getAttribute("x")+textW(t)+15-x;if(e>need)need=e;});
    if(need>+r.getAttribute("width")){const w=Math.ceil(need);r.setAttribute("width",w);
      const l=g.querySelector("line");if(l)l.setAttribute("x2",x+w-15);}
  });
}
function applyCam(){ if(cam) cam.setAttribute("transform",`translate(${state.tx.toFixed(2)} ${state.ty.toFixed(2)}) scale(${state.z.toFixed(3)})`); }
function applyFilter(){
  svg.querySelectorAll("[data-p]").forEach(el=>{

  });

function markSelected(){

function copyLink(){

/* ── pin quiz ───────────────────────────────────────────
   Pins lose their name tooltips. Tapping one asks which lesion it marks, with a
   clue from the card (its own name blanked out) and three distractors drawn from
   the same map first. Answers ring the pin green or red for the session. */
function mapIds(v){ return Object.keys(LOC).filter(id=>LES[id]&&LOC[id].some(l=>l.v===v)); }
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const PQ_STOP=new Set("disease syndrome syndromes deficiency anemia type types with versus their drugs drug poisoning toxicity inhibitors inhibitor acid acids receptor receptors hormone mutation loss excess agents blockers class".split(" "));
function redactor(L){
  const words=new Set();
  (L.n+" "+(L.alias||"")).split(/[^A-Za-z0-9-]+/).forEach(w=>{ w=w.replace(/^-+|-+$/g,""); if(w.length>=4&&!PQ_STOP.has(w.toLowerCase())) words.add(w); });
  if(!words.size) return x=>x;
  const re=new RegExp("\\b(?:"+[...words].map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")[A-Za-z-]*","gi");
  return x=>String(x).replace(re,"▢▢▢");
}
function quizWhere(id){
  const m=MAPS[state.view], l=(LOC[id]||[]).find(x=>x.v===state.view); if(!l) return "";
  if(l.n) return l.n.l;
  return l.e.e?l.e.e.replace(/\|/g," "):`${m._n[l.e.a].l} → ${m._n[l.e.b].l}`;
}
function quizOptions(id){
  /* hardest distractors first: pinned on the same node or edge, then the same
     pathway on this map, then the same kind of marker, then anywhere */
  const L=LES[id], here=mapIds(state.view), all=Object.keys(LES);
  const spots=(LOC[id]||[]).filter(l=>l.v===state.view).map(l=>l.n||l.e);
  const sameSpot=here.filter(k=>(LOC[k]||[]).some(l=>l.v===state.view&&spots.includes(l.n||l.e)));
  const pools=[sameSpot, here.filter(k=>LES[k].p===L.p), here.filter(k=>LES[k].k===L.k), here,
    all.filter(k=>LES[k].p===L.p), all.filter(k=>LES[k].k===L.k)];
  const pick=new Set([id]);
  for(const pool of pools){ for(const k of shuffle(pool.filter(k=>!pick.has(k)&&LES[k].n!==L.n))){ if(pick.size>=4) break; pick.add(k); } }
  return shuffle([...pick]);
}
function openQuiz(id){
  const L=LES[id]; if(!L) return;
  state.sel=null; drawer.hidden=false;
  const red=redactor(L);
  const clue=((L.find&&L.find.length)?L.find:(L.labs||[])).slice(0,2).map(red);
  drawer.innerHTML=`
   <div class="dhead">
     <button class="dclose" id="dclose" aria-label="Close">×</button>
     <span class="dkind" style="--k:${mkc(L.k)}">${MK[L.k].g}&nbsp;&nbsp;${MK[L.k].n}</span>
     <h2 class="dtitle">Which lesion is pinned here?</h2>
     <p class="pqwhere">On <b>${esc(red(quizWhere(id)))}</b></p>
   </div>
   <div class="dbody">
     ${L.enz?sec("Enzyme / step",`<p><b>${esc(red(L.enz))}</b></p>`):""}
     ${sec("Clue",ul(clue))}
     ${sec("Your answer",`<div class="pqopts">${quizOptions(id).map(k=>`<button class="pqopt" data-a="${k}">${esc(LES[k].n)}</button>`).join("")}</div>`)}
   </div>`;
  drawer.scrollTop=0;
  document.getElementById("dclose").onclick=closeDrawer;
  drawer.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    (PQ[state.view]=PQ[state.view]||{})[id]=(b.dataset.a===id);
    openLes(id,false,b.dataset.a); updateScore();
  });
  render(); flashPins(id,false); writeHash();
}
function nextQuiz(){
  const done=PQ[state.view]||{}, left=mapIds(state.view).filter(k=>!(k in done));
  if(!left.length){ closeDrawer(); return; }
  const id=left[Math.floor(Math.random()*left.length)];
  openQuiz(id); flashPins(id,true);
}
function updateScore(){
  const box=document.getElementById("qscore");
  const on=state.quiz==="pins"&&state.view!=="index";
  box.hidden=!on; if(!on) return;
  const total=mapIds(state.view).length, done=PQ[state.view]||{};
  const named=Object.keys(done).length, right=Object.values(done).filter(Boolean).length;
  box.innerHTML=`<span>Named <b>${named}/${total}</b> · <b>${right}</b> right</span>
    <span class="qbar"><i style="width:${total?Math.round(named/total*100):0}%"></i></span>
    ${named<total?`<button class="go" data-qnext>Next pin</button>`:`<span>All done</span>`}
    ${named?`<button data-qreset title="Clear this map's answers">Reset</button>`:""}`;
  const n=box.querySelector("[data-qnext]"); if(n) n.onclick=nextQuiz;
  const r=box.querySelector("[data-qreset]"); if(r) r.onclick=()=>{ delete PQ[state.view]; closeDrawer(); updateScore(); };
}
function setQuiz(mode){
  state.quiz=mode; state.reveal.clear();
  const b=document.getElementById("quizBtn");
  b.classList.toggle("on",!!mode);
  b.textContent=mode==="steps"?"Quiz: steps":mode==="pins"?"Quiz: pins":"Quiz";
  document.querySelectorAll("#qmenu [data-q]").forEach(o=>o.setAttribute("aria-checked",String(o.dataset.q===mode)));
  if(mode==="pins"){ drawer.hidden=true; state.sel=null; writeHash(); }
  if(state.view!=="index") render();
  renderRail(); updateScore();
}

/* ── deep links ─────────────────────────────────────────
   #view · #view/card · #card. The hash mirrors the screen, so any map or open
   card can be shared, and the question bank links straight to a card. A bare
   #card opens on the card's first home. */
/* The drawer can stay open on a map the card is not pinned to (after a tab
   switch), so the card joins the hash only when it lives on this view. */
const livesOn=(id,v)=>v==="index"||(LOC[id]||[]).some(l=>l.v===v);
function writeHash(){
  const card=state.sel&&!drawer.hidden&&livesOn(state.sel,state.view);
  const h="#"+state.view+(card?"/"+state.sel:"");
  if(location.hash!==h){ try{ history.replaceState(null,"",h); }catch(e){} }
}
function cardLink(id){
  const base=location.href.split("#")[0];
  return base+"#"+(livesOn(id,state.view)?state.view+"/":"")+id;
}
let booted=false;
function readHash(){
  let raw=""; try{ raw=decodeURIComponent((location.hash||"").slice(1)); }catch(e){ return false; }
  if(!raw) return false;
  const [a,b]=raw.split("/"), isView=v=>v==="index"||Object.prototype.hasOwnProperty.call(MAPS,v);
  if(b){
    if(!isView(a)) return false;
    if(state.view!==a||!booted) setView(a);
    if(LES[b]){ if(a==="index") openLes(b,false); else gotoLes(b); }
    return true;
  }
  if(isView(a)){ setView(a); return true; }
  if(LES[a]){ const home=(LOC[a]||[])[0]; setView(home?home.v:"index"); openLes(a,true); return true; }
  return false;
}
window.addEventListener("hashchange",()=>{ readHash(); });
function flashPins(id,center){
  const pins=[...svg.querySelectorAll(`.pin[data-les="${id}"]`)];
  pins.forEach(p=>p.classList.add("flash"));
  if(center&&pins.length){
    const t=(pins[0].getAttribute("transform")||"").match(/translate\(([-\d.]+) ([-\d.]+)\)/);
    if(t) centerOn(+t[1],+t[2]);
  }
}
function gotoLes(id){
  /* A card pinned on several maps must not pull the reader off the map they are
     already on. Stay put if it lives here; otherwise go to its first home. */
  const locs=LOC[id]||[];
  const loc=locs.find(l=>l.v===state.view)||locs[0];
  if(loc&&loc.v!==state.view) setView(loc.v);
  openLes(id,true);
}
function centerOn(x,y){
  const m=MAPS[state.view];
  let cy=m.h/2;
  state.z=Math.max(state.z,1.25);
  /* On a phone the drawer is a bottom sheet over ~70% of the map, and a whole
     map squeezed into 375px leaves pins a few pixels wide. Zoom until nodes are
     readable and centre on the strip still visible above the sheet. */
  if(innerWidth<=1000){
    const r=svg.getBoundingClientRect();
    if(r.width&&r.height){
      const fit=Math.min(r.width/m.w,r.height/m.h);
      state.z=Math.min(6,Math.max(state.z,0.5/fit));
      if(!drawer.hidden){
        const top=drawer.getBoundingClientRect().top;
        if(top>r.top+40&&top<r.bottom){
          const a=toVB(r.left+r.width/2,(r.top+top)/2), b=toVB(r.left+r.width/2,r.top+r.height/2);
          cy+=a.y-b.y;
        }
      }
    }
  }
  state.tx=m.w/2-x*state.z; state.ty=cy-y*state.z; applyCam();
}

/* ── rail ───────────────────────────────────────────── */
function lesMatches(L,q){
  if(!q) return true;
  const hay=[L.n,L.alias||"",L.enz||"",L.mech||"",(PATHS[L.p]||{}).n||"",
    ...(L.find||[]),...(L.labs||[]),...(L.buzz||[]),...(L.tx||[]),...(L.q||[])].join(" ").toLowerCase();
  return hay.includes(q);
}
function currentLesIds(){
  const q=state.q.trim().toLowerCase();
  let ids;
  if(q||state.view==="index") ids=Object.keys(LES);
  else ids=[...new Set(Object.keys(LOC).filter(id=>LOC[id].some(l=>l.v===state.view)))];
  return ids.filter(id=>LES[id]&&lesMatches(LES[id],q)&&(!state.filter||state.view==="index"||LES[id].p===state.filter));
}
function renderRail(){
  const m=MAPS[state.view];
  let html="";
  if(m&&m.sub) html+=`<div class="rail-sec"><p class="rail-sub">${esc(m.sub)}</p></div>`;
  if(m){
    const counts={};
    m.edges.forEach(e=>counts[e.p]=(counts[e.p]||0)+1);
    m.nodes.forEach(n=>counts[n.p]=(counts[n.p]||0)+0);
    const keys=[...new Set([...m.nodes.map(n=>n.p),...m.edges.map(e=>e.p)])].filter(p=>p!=="neutral");
    html+=`<div class="rail-sec"><h3 class="rail-h">Pathways</h3><div class="chips">
      <button class="pchip${state.filter?"":" on"}" data-f=""><span class="swatch" style="--c:var(--ink-3)"></span>Show everything</button>
      ${keys.map(p=>`<button class="pchip${state.filter===p?" on":""}" data-f="${p}"><span class="swatch" style="--c:${pc(p)}"></span>${esc(PATHS[p].n)}<span class="n">${counts[p]||""}</span></button>`).join("")}
    </div></div>`;
  }
  html+=`<div class="rail-sec"><h3 class="rail-h">Markers</h3><div class="legend">
    ${Object.entries(MK).map(([k,v])=>`<div class="lg"><svg width="19" height="19" viewBox="-10 -10 20 20">${
      k==="dz"?`<circle r="9" fill="${mkc(k)}"/>`:k==="drug"?`<rect x="-7.5" y="-7.5" width="15" height="15" rx="2" fill="${mkc(k)}" transform="rotate(45)"/>`:`<rect x="-8" y="-8" width="16" height="16" rx="4" fill="${mkc(k)}"/>`
    }<text x="0" y="0.5" text-anchor="middle" dominant-baseline="central" fill="#fff" style="font:700 10px sans-serif">${v.g}</text></svg>${v.n}</div>`).join("")}
    <div class="lg"><svg width="19" height="19" viewBox="0 0 20 20"><line x1="4" y1="3" x2="4" y2="17" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/></svg>Rate-limiting step</div>
    <div class="lg"><svg width="19" height="19" viewBox="0 0 20 20"><line x1="1" y1="10" x2="19" y2="10" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="5 4"/></svg>Multi-step, transport or regulation</div>
  </div></div>`;
  const ids=currentLesIds();
  if(state.quiz==="pins"&&!state.q&&state.view!=="index"){
    html+=`<div class="rail-sec"><h3 class="rail-h">Lesions on this map · ${ids.length}</h3><p class="rail-sub">Hidden while you name the pins. Searching still works.</p></div>`;
    rail.innerHTML=html;
    rail.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.f||null;render();renderRail();});
    return;
  }
  html+=`<div class="rail-sec"><h3 class="rail-h">${state.q?"Search results":(state.view==="index"?"All lesions":"Lesions on this map")} · ${ids.length}</h3>
    <div class="lesionlist">${ids.length?ids.map(id=>{const L=LES[id];
      return `<button class="li" data-les="${id}" style="--c:${mkc(L.k)}"><span class="dot"></span><span><span class="nm">${esc(L.n)}</span><span class="bz">${esc(L.buzz&&L.buzz[0]?L.buzz[0]:(L.enz||""))}</span></span></button>`;
    }).join(""):`<p style="font-size:12.5px;color:var(--ink-3);padding:4px 7px">No match. Try “Heinz”, “orotic”, “second wind”.</p>`}</div></div>`;
  rail.innerHTML=html;
  rail.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.f||null;render();renderRail();if(state.view==="index")renderIndex();});
  rail.querySelectorAll("[data-les]").forEach(b=>b.onclick=()=>gotoLes(b.dataset.les));
}

/* ── index view ─────────────────────────────────────── */
function renderIndex(){
  const q=state.q.trim().toLowerCase();
  const ids=Object.keys(LES).filter(id=>lesMatches(LES[id],q));
  const groups={};
  ids.forEach(id=>{(groups[LES[id].p]=groups[LES[id].p]||[]).push(id);});
  const cards=Object.entries(groups).map(([p,list])=>`
    <section class="idxcard" style="--c:${pc(p)}"><h3><span class="bar"></span>${esc((PATHS[p]||PATHS.neutral).n)}</h3>
    <ul>${list.map(id=>{const L=LES[id];return `<li><button class="idxrow" data-les="${id}">
      <span class="t">${esc(L.n)}</span><span class="e">${esc(L.enz||"")}</span>
      ${L.buzz&&L.buzz[0]?`<span class="b">${esc(L.buzz[0])}</span>`:""}</button></li>`;}).join("")}</ul></section>`).join("");
  idxWrap.innerHTML=`<div class="idx-intro"><h2>Every lesion on one page</h2>
    <p>${ids.length} entries across the ${Object.keys(MAPS).length} maps — grouped by pathway, each with the enzyme it sits on and the phrase a question is most likely to hand you. Click any row to jump to its exact position on the map.</p></div>
    ${cards||`<p class="empty">Nothing matches “${esc(state.q)}”.</p>`}`;
  idxWrap.querySelectorAll("[data-les]").forEach(b=>b.onclick=()=>gotoLes(b.dataset.les));
}

/* ── navigation: broad topics, then the maps inside the chosen one ── */
const topicsEl=document.getElementById("topics"), subbar=document.getElementById("subbar");
const TOPIC_OF={}; TOPICS.forEach(([t,,vs])=>vs.forEach(v=>{ TOPIC_OF[v]=t; }));
const lastInTopic={};
function renderNav(){
  const t=TOPIC_OF[state.view]; lastInTopic[t]=state.view;
  topicsEl.innerHTML=TOPICS.map(([id,l])=>`<button class="tab" role="tab" data-t="${id}" aria-selected="${id===t}">${esc(l)}</button>`).join("");
  topicsEl.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    const vs=TOPICS.find(x=>x[0]===b.dataset.t)[2];
    setView(lastInTopic[b.dataset.t]||vs[0]);
  });
  const vs=(TOPICS.find(x=>x[0]===t)||[0,0,[]])[2];
  subbar.hidden=vs.length<2;
  tabsEl.innerHTML=vs.map(v=>`<button class="tab" role="tab" data-v="${v}" aria-selected="${v===state.view}">${esc((VIEWS.find(x=>x[0]===v)||[v,v])[1])}</button>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setView(b.dataset.v));
  [topicsEl,tabsEl].forEach(el=>{ const cur=el.querySelector('[aria-selected="true"]');
    if(cur) el.scrollLeft=Math.max(0,cur.offsetLeft-el.clientWidth/2+cur.offsetWidth/2); });
}

/* ── views & camera ─────────────────────────────────── */
function setView(v){
  state.view=v; state.filter=null; state.z=1; state.tx=0; state.ty=0;
  const isIdx=v==="index";
  svg.hidden=isIdx; idxWrap.hidden=!isIdx;
  document.querySelector(".toolbar").hidden=isIdx;
  document.querySelector(".hint").hidden=isIdx;
  renderNav();
  if(isIdx) renderIndex(); else render();
  renderRail(); updateScore(); writeHash();
  try{localStorage.setItem("mla-view",v);}catch(e){}
}
function toVB(cx,cy){
  const ctm=svg.getScreenCTM(); if(!ctm) return {x:0,y:0};
  const p=svg.createSVGPoint(); p.x=cx; p.y=cy;
  const q=p.matrixTransform(ctm.inverse()); return {x:q.x,y:q.y};
}
function zoomBy(k,px,py){
  const m=MAPS[state.view]; if(!m) return;
  const p=(px==null)?{x:m.w/2,y:m.h/2}:{x:px,y:py};
  const nz=Math.min(6,Math.max(.35,state.z*k));
  state.tx=p.x-(p.x-state.tx)*(nz/state.z);
  state.ty=p.y-(p.y-state.ty)*(nz/state.z);
  state.z=nz; applyCam();
}
/* Wheel and trackpad zoom scale with the size of the scroll, so a trackpad pinch
   (which arrives as ctrl+wheel) is smooth and a mouse notch is one ~14% step. */
svg.addEventListener("wheel",ev=>{
  ev.preventDefault();
  const d=Math.max(-60,Math.min(60,ev.deltaY*(ev.deltaMode===1?33:1)));
  const p=toVB(ev.clientX,ev.clientY); zoomBy(Math.exp(-d*(ev.ctrlKey?0.012:0.0022)),p.x,p.y);
},{passive:false});
/* Pointers. One finger or the mouse pans; two fingers pinch-zoom about their
   midpoint and pan with it. A drag only starts after the pointer travels a few
   pixels, so a tap on a pin, chip or node still reaches the click handler, and a
   pan may start on top of a node — which on a phone is most of the screen. */
const ptrs=new Map(); let drag=null, pinch=null, dragged=false;
function pinchInfo(){ const [a,b]=[...ptrs.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
function startPinch(){
  const i=pinchInfo(); drag=null; dragged=true; svg.classList.add("drag");
  pinch={d:i.d,z:state.z,tx:state.tx,ty:state.ty,m:toVB(i.x,i.y)};
}
svg.addEventListener("pointerdown",ev=>{
  if(ev.pointerType==="mouse"&&ev.button!==0) return;
  ev.preventDefault();               // otherwise the drag starts a page-wide text selection
  if(ptrs.size===0) dragged=false;
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY,sx:ev.clientX,sy:ev.clientY});
  if(ptrs.size===2) startPinch();
});
svg.addEventListener("pointermove",ev=>{
  const p=ptrs.get(ev.pointerId); if(!p) return;
  p.x=ev.clientX; p.y=ev.clientY;
  if(pinch){
    if(ptrs.size<2) return;
    const i=pinchInfo(), q=toVB(i.x,i.y);
    const nz=Math.min(6,Math.max(.35,pinch.z*i.d/pinch.d));
    const mx=(pinch.m.x-pinch.tx)/pinch.z, my=(pinch.m.y-pinch.ty)/pinch.z;   // map point under the fingers
    state.z=nz; state.tx=q.x-mx*nz; state.ty=q.y-my*nz; applyCam(); return;
  }
  if(!drag){
    if(Math.hypot(p.x-p.sx,p.y-p.sy)<6) return;
    drag={p:toVB(p.sx,p.sy),tx:state.tx,ty:state.ty}; dragged=true;
    try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
    svg.classList.add("drag");
  }
  const sel=window.getSelection && window.getSelection();
  if(sel && !sel.isCollapsed) sel.removeAllRanges();
  const q=toVB(p.x,p.y);
  state.tx=drag.tx+(q.x-drag.p.x); state.ty=drag.ty+(q.y-drag.p.y); applyCam();
});
function endPointer(ev){
  if(!ptrs.delete(ev.pointerId)) return;
  if(pinch&&ptrs.size<2){
    pinch=null; drag=null;
    if(ptrs.size===1){ const [p]=ptrs.values(); p.sx=p.x; p.sy=p.y; drag={p:toVB(p.x,p.y),tx:state.tx,ty:state.ty}; }
  }
  if(!ptrs.size){ drag=null; svg.classList.remove("drag"); }
}
svg.addEventListener("pointerup",endPointer);
svg.addEventListener("pointercancel",endPointer);
svg.addEventListener("pointerleave",ev=>{ if(!svg.hasPointerCapture||!svg.hasPointerCapture(ev.pointerId)) endPointer(ev); });
svg.addEventListener("gesturestart",ev=>ev.preventDefault());   // Safari: keep the page itself from zooming
svg.addEventListener("click",ev=>{
  if(dragged){ dragged=false; return; }   // the end of a pan is not a tap
  const pq=state.quiz==="pins";
  const ask=id=>{ if(pq&&!(PQ[state.view]&&id in PQ[state.view])) openQuiz(id); else openLes(id,false); };
  const pin=ev.target.closest(".pin");
  if(pin){ ask(pin.dataset.les); return; }
  const chip=ev.target.closest(".chip");
  if(chip){
    const m=MAPS[state.view], e=m.edges.find(x=>x._k===chip.dataset.chip);
    if(state.quiz==="steps"&&!state.reveal.has(chip.dataset.chip)){ state.reveal.add(chip.dataset.chip); render(); return; }
    if(e&&e.m&&e.m.length) ask(e.m[0]);
    return;
  }
  const nd=ev.target.closest(".node");
  if(nd){
    const n=MAPS[state.view]._n[nd.dataset.node];
    if(n.m&&n.m.length){ ask(n.m[0]); return; }
    if(n.go){ setView(n.go); return; }
    if(n.hl){ const t=svg.querySelector(`.node[data-node="${n.hl}"] > rect`); if(t){ t.classList.add("hl"); setTimeout(()=>t.classList.remove("hl"),1800); centerOn(MAPS[state.view]._n[n.hl].x,MAPS[state.view]._n[n.hl].y);} }
  }
});
document.getElementById("zin").onclick=()=>zoomBy(1.25);
document.getElementById("zout").onclick=()=>zoomBy(1/1.25);
document.getElementById("zfit").onclick=()=>{state.z=1;state.tx=0;state.ty=0;applyCam();};
const railBtn=document.getElementById("railBtn");
function setRail(off,save){
  document.documentElement.setAttribute("data-rail",off?"off":"on");
  railBtn.setAttribute("aria-pressed",String(off));
  railBtn.title=(off?"Show":"Hide")+" the side panel  ( [ )";
  if(save!==false){ try{localStorage.setItem("mla-rail",off?"off":"on");}catch(e){} }
}
railBtn.onclick=()=>setRail(document.documentElement.getAttribute("data-rail")!=="off");
const quizBtn=document.getElementById("quizBtn"), qmenu=document.getElementById("qmenu");
function showQuizMenu(open){ qmenu.hidden=!open; quizBtn.setAttribute("aria-expanded",String(open)); }
quizBtn.onclick=ev=>{ ev.stopPropagation(); showQuizMenu(qmenu.hidden); };
qmenu.querySelectorAll("[data-q]").forEach(o=>o.onclick=()=>{ showQuizMenu(false); setQuiz(o.dataset.q); });
document.addEventListener("click",ev=>{ if(!qmenu.hidden&&!ev.target.closest(".qwrap")) showQuizMenu(false); });
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("mla-theme",next);}catch(e){}
  if(state.view!=="index") render();
};
let qt;
qInput.addEventListener("input",()=>{
  clearTimeout(qt);
  qt=setTimeout(()=>{state.q=qInput.value;renderRail();if(state.view==="index")renderIndex();},130);
});
qInput.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"){ const ids=currentLesIds(); if(ids.length===1) gotoLes(ids[0]); else if(state.view!=="index") setView("index"); }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="/"&&document.activeElement!==qInput){ ev.preventDefault(); qInput.focus(); }
  if(ev.key==="["&&document.activeElement!==qInput){ ev.preventDefault(); railBtn.click(); }
  if(ev.key==="Escape"){ if(!qmenu.hidden){ showQuizMenu(false); return; } if(!drawer.hidden) closeDrawer(); }
});

/* ── init ───────────────────────────────────────────── */
detectLetterSpacing();
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{
  try{ detectLetterSpacing(); fitChips(); fitPanels(); fitComps(); }catch(e){}
}); }catch(e){}

try{const th=localStorage.getItem("mla-theme"); document.documentElement.setAttribute("data-theme",th||"light");}catch(e){document.documentElement.setAttribute("data-theme","light");}
try{setRail(localStorage.getItem("mla-rail")==="off",false);}catch(e){setRail(false,false);}
try{ if(matchMedia("(pointer:coarse)").matches) document.getElementById("hint").textContent="drag to pan · pinch to zoom · tap any pin"; }catch(e){}
if(!readHash()){
  let start="core";
  try{const v=localStorage.getItem("mla-view"); if(v&&VIEWS.some(x=>x[0]===v)) start=v;}catch(e){}
  setView(start);
  openLes("g6pd",false);
}
booted=true;
</script>
