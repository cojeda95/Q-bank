<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychiatry Block — Question Bank</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/theme.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="../index.html" class="link-btn" style="text-decoration:none; display:inline-block;">&larr; All Blocks</a>
      <span class="brand">Psychiatry Block Question Bank</span>
      <button id="homeBtn" class="link-btn" hidden>Home</button>
    </div>
  </header>
  <main id="main" class="container">
    <p class="loading">Loading question bank…</p>
  </main>
  <footer class="footer">
    <p>Client-side only — all progress is stored in this browser via localStorage.</p>
  </footer>
</div>
<script>window.QUIZ_CONFIG = {
  title: 'Psychiatry Block Question Bank',
  storageKey: 'psych',
  // One-click Final Exam presets (shared/app.js, finalPresets). perSdl maps an exam
  // number to the [min, max] questions drawn from EACH of its SDLs; every run picks a
  // count in that range per SDL. Psych's exams are weekly, so week N is Exam N.
  finalPresets: [{
    id: 'williams',
    name: "Dr. Williams' Distribution",
    source: "Course email: approximately 2-3 MCQs from each SDL in weeks 1 & 2, 1-2 from each of week 3's SDLs, and 5-6 per SDL from the 4th and final week.",
    perSdl: { 1: [2, 3], 2: [2, 3], 3: [1, 2], 4: [5, 6] }
  }]
};</script>
<script src="data.js"></script>
<script src="../shared/app.js"></script>
</body>
</html>
